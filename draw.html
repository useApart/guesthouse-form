<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>게스트하우스 신청서 (직접 쓰기)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #F5F4F0; color: #1E251E; }
  .wrap { min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px 64px; }
  .inner { width: 100%; max-width: 560px; }
  .eyebrow { text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: #7A8177; margin-bottom: 6px; }
  h1 { text-align: center; margin: 0 0 8px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .tabs { display: flex; background: #EAE8E1; border-radius: 14px; padding: 4px; margin-bottom: 20px; gap: 4px; }
  .tab { flex: 1; height: 44px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; background: transparent; color: #7A8177; width: 100%; }
  .tab.active { background: #fff; color: #1F6D57; box-shadow: 0 1px 2px rgba(30,37,30,.08); }
  .card { background: #fff; border-radius: 20px; border: 1px solid #E8E6DE; box-shadow: 0 1px 3px rgba(30,37,30,.04); padding: 24px; display: flex; flex-direction: column; gap: 14px; }
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; position: sticky; top: 0; background: #fff; z-index: 2; padding-bottom: 10px; border-bottom: 1px solid #F0EEE7; }
  .swatches { display: flex; gap: 8px; }
  .swatch { width: 28px; height: 28px; border-radius: 50%; cursor: pointer; border: 2px solid #E8E6DE; padding: 0; }
  .swatch.active { border: 2.5px solid #1F6D57; }
  .divider { width: 1px; height: 22px; background: #E8E6DE; }
  .tool-btn { height: 34px; padding: 0 12px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; border: 1px solid #D8D6CD; background: #fff; color: #3C443B; }
  .tool-btn.active { border: 1.5px solid #1F6D57; background: #EAF3EF; color: #1F6D57; }
  .tool-btn.danger { color: #B5473A; }
  .field-box { display: flex; flex-direction: column; gap: 6px; }
  .field-head { display: flex; align-items: center; justify-content: space-between; }
  .field-label { font-size: 13px; font-weight: 600; color: #3C443B; }
  .field-clear { border: none; background: none; color: #9A9F92; font-size: 12px; cursor: pointer; text-decoration: underline; font-family: inherit; }
  .canvas-wrap { position: relative; border-radius: 12px; border: 1px solid #E8E6DE; background: #FBFAF7; overflow: hidden; touch-action: none; }
  .canvas-wrap canvas { width: 100%; display: block; cursor: crosshair; position: relative; z-index: 1; }
  .guideline { position: absolute; left: 12px; right: 12px; bottom: 14px; height: 1px; background: #DCD9CE; z-index: 0; }
  .field-box.small .canvas-wrap canvas { height: 64px; }
  .field-box.wide .canvas-wrap canvas { height: 76px; }
  .field-box.period .canvas-wrap canvas { height: 110px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .btn-row { display: flex; gap: 10px; margin-top: 6px; }
  .btn { flex: 1; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; border: none; }
  .btn-primary { background: #1F6D57; color: #fff; }
  .btn-primary:hover { background: #195C49; }
  .btn-secondary { background: #fff; color: #3C443B; border: 1px solid #D8D6CD; }
  .btn-secondary:hover { background: #F5F4F0; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-secondary:disabled:hover { background: #fff; }
  .btn-primary:disabled:hover { background: #1F6D57; }
  .status-msg { margin: 0; font-size: 13px; color: #7A8177; min-height: 1.2em; }
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: #1E251E; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <div class="eyebrow">원흥LH13단지주거복지지원센터</div>
    <h1>게스트하우스 신청서</h1>

    <div class="tabs">
      <a href="index.html" style="text-decoration:none; flex:1;">
        <button class="tab" type="button" style="width:100%;">타이핑으로 작성</button>
      </a>
      <button class="tab active" type="button">손으로 직접 쓰기</button>
    </div>

    <div class="card">
      <div class="toolbar">
        <div class="swatches" id="swatches">
          <button type="button" class="swatch active" data-c="#1E251E" style="background:#1E251E;" aria-label="검정"></button>
          <button type="button" class="swatch" data-c="#B5473A" style="background:#B5473A;" aria-label="빨강"></button>
          <button type="button" class="swatch" data-c="#2C5FA8" style="background:#2C5FA8;" aria-label="파랑"></button>
        </div>
        <div class="divider"></div>
        <button type="button" class="tool-btn active" id="thinBtn">얇게</button>
        <button type="button" class="tool-btn" id="boldBtn">굵게</button>
        <div class="divider"></div>
        <button type="button" class="tool-btn" id="eraserBtn">지우개</button>
        <button type="button" class="tool-btn danger" id="clearAllBtn">전체 지우기</button>
      </div>

      <div class="row2">
        <div class="field-box small">
          <div class="field-head"><span class="field-label">신청일</span><button type="button" class="field-clear" data-target="c-applyDate">지우기</button></div>
          <div class="canvas-wrap"><canvas class="board" id="c-applyDate"></canvas><div class="guideline"></div></div>
        </div>
        <div class="field-box small">
          <div class="field-head"><span class="field-label">은행입금일</span><button type="button" class="field-clear" data-target="c-deposit">지우기</button></div>
          <div class="canvas-wrap"><canvas class="board" id="c-deposit"></canvas><div class="guideline"></div></div>
        </div>
      </div>

      <div class="field-box wide">
        <div class="field-head"><span class="field-label">성명</span><button type="button" class="field-clear" data-target="c-name">지우기</button></div>
        <div class="canvas-wrap"><canvas class="board" id="c-name"></canvas><div class="guideline"></div></div>
      </div>

      <div class="row2">
        <div class="field-box small">
          <div class="field-head"><span class="field-label">동·호수</span><button type="button" class="field-clear" data-target="c-unit">지우기</button></div>
          <div class="canvas-wrap"><canvas class="board" id="c-unit"></canvas><div class="guideline"></div></div>
        </div>
        <div class="field-box small">
          <div class="field-head"><span class="field-label">연락처</span><button type="button" class="field-clear" data-target="c-phone">지우기</button></div>
          <div class="canvas-wrap"><canvas class="board" id="c-phone"></canvas><div class="guideline"></div></div>
        </div>
      </div>

      <div class="field-box period">
        <div class="field-head"><span class="field-label">사용기간 (입실~퇴실)</span><button type="button" class="field-clear" data-target="c-period">지우기</button></div>
        <div class="canvas-wrap"><canvas class="board" id="c-period"></canvas><div class="guideline"></div></div>
      </div>

      <div class="row2">
        <div class="field-box small">
          <div class="field-head"><span class="field-label">숙박일수</span><button type="button" class="field-clear" data-target="c-nights">지우기</button></div>
          <div class="canvas-wrap"><canvas class="board" id="c-nights"></canvas><div class="guideline"></div></div>
        </div>
        <div class="field-box small">
          <div class="field-head"><span class="field-label">사용인원</span><button type="button" class="field-clear" data-target="c-people">지우기</button></div>
          <div class="canvas-wrap"><canvas class="board" id="c-people"></canvas><div class="guideline"></div></div>
        </div>
      </div>

      <div class="field-box wide">
        <div class="field-head"><span class="field-label">사용금액</span><button type="button" class="field-clear" data-target="c-amount">지우기</button></div>
        <div class="canvas-wrap"><canvas class="board" id="c-amount"></canvas><div class="guideline"></div></div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-primary" id="sendBtn" disabled>이미지 만들어 보내기</button>
        <button type="button" class="btn btn-secondary" id="saveBtn" disabled>이미지 저장</button>
      </div>
      <p id="status" class="status-msg"></p>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };

  // ---- 서식 이미지 로딩 ('loading' | 'ready' | 'error') ----
  var imageState = 'loading';
  var formImage = new Image();
  formImage.onload = function () { imageState = 'ready'; syncButtons(); };
  formImage.onerror = function () { imageState = 'error'; syncButtons(); };
  formImage.src = 'form.jpg';

  // 707x1000 좌표계. 표 격자선을 픽셀 스캔으로 실측한 각 칸의 좌상단/너비/높이.
  var CELLS = {
    applyDate: { x: 231, y: 198, w: 403, h: 26 },
    name:      { x: 231, y: 228, w: 403, h: 25 },
    unit:      { x: 231, y: 257, w: 403, h: 26 },
    phone:     { x: 231, y: 287, w: 403, h: 25 },
    period:    { x: 232, y: 323, w: 138, h: 28 },
    nights:    { x: 487, y: 323, w: 147, h: 28 },
    amount:    { x: 232, y: 355, w: 138, h: 29 },
    people:    { x: 487, y: 355, w: 147, h: 29 },
    deposit:   { x: 232, y: 454, w: 138, h: 34 },
  };

  function setStatus(msg) { $('status').textContent = msg; }

  var toastTimer;
  function showToast(msg) {
    var toast = $('toast');
    clearTimeout(toastTimer);
    toast.textContent = msg;
    toast.classList.add('show');
    toastTimer = setTimeout(function () { toast.classList.remove('show'); }, 1800);
  }

  function syncButtons() {
    var blocked = imageState !== 'ready';
    $('sendBtn').disabled = blocked;
    $('saveBtn').disabled = blocked;
    if (imageState === 'error') {
      setStatus('서식 이미지를 불러오지 못했습니다. 새로고침해 주세요.');
    } else if (imageState === 'loading') {
      setStatus('서식 이미지를 불러오는 중입니다...');
    } else {
      setStatus('');
    }
  }

  // ---- 손글씨 입력 (필드별 캔버스, 투명 배경) ----
  var color = '#1E251E';
  var thickness = 3;
  var eraser = false;
  var penSeen = false;
  var boards = [];

  function setupCanvas(canvas) {
    var rect = canvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.max(1, Math.round(rect.width * dpr));
    canvas.height = Math.max(1, Math.round(rect.height * dpr));
    var ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    return { canvas: canvas, ctx: ctx, dpr: dpr, drawing: false, lastPoint: null, midPoint: null, activePointerId: null };
  }

  document.querySelectorAll('.board').forEach(function (canvas) {
    var b = setupCanvas(canvas);
    boards.push(b);
    attachEvents(b);
  });

  window.addEventListener('resize', function () {
    boards.forEach(function (b) {
      var data = null;
      try { data = b.canvas.toDataURL(); } catch (e) {}
      var fresh = setupCanvas(b.canvas);
      b.ctx = fresh.ctx;
      b.dpr = fresh.dpr;
      if (data) {
        var img = new Image();
        img.onload = function () {
          var rect = b.canvas.getBoundingClientRect();
          b.ctx.drawImage(img, 0, 0, rect.width, rect.height);
        };
        img.src = data;
      }
    });
  });

  function getPoint(canvas, e) {
    var rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function attachEvents(b) {
    var canvas = b.canvas;

    canvas.addEventListener('pointerdown', function (e) {
      if (e.pointerType === 'pen') penSeen = true;
      // 손바닥 오인 방지: 펜을 한 번이라도 썼으면 이후 터치 입력은 전부 무시한다.
      if (e.pointerType === 'touch' && penSeen) return;
      // 이미 한 손가락으로 그리는 중이면 나머지(손바닥 등)는 무시한다.
      if (b.activePointerId !== null) return;
      e.preventDefault();
      b.activePointerId = e.pointerId;
      b.drawing = true;
      b.lastPoint = getPoint(canvas, e);
      b.midPoint = null;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', function (e) {
      if (!b.drawing || e.pointerId !== b.activePointerId) return;
      e.preventDefault();
      var points = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      if (!points.length) points = [e];
      b.ctx.globalCompositeOperation = eraser ? 'destination-out' : 'source-over';
      b.ctx.strokeStyle = color;
      b.ctx.lineWidth = eraser ? thickness * 5 : thickness;
      points.forEach(function (ev) {
        var pt = getPoint(canvas, ev);
        var mid = { x: (b.lastPoint.x + pt.x) / 2, y: (b.lastPoint.y + pt.y) / 2 };
        b.ctx.beginPath();
        b.ctx.moveTo(b.midPoint ? b.midPoint.x : b.lastPoint.x, b.midPoint ? b.midPoint.y : b.lastPoint.y);
        b.ctx.quadraticCurveTo(b.lastPoint.x, b.lastPoint.y, mid.x, mid.y);
        b.ctx.stroke();
        b.midPoint = mid;
        b.lastPoint = pt;
      });
    });

    function end(e) {
      if (e && e.pointerId !== b.activePointerId) return;
      b.drawing = false;
      b.lastPoint = null;
      b.midPoint = null;
      b.activePointerId = null;
    }
    canvas.addEventListener('pointerup', end);
    canvas.addEventListener('pointercancel', end);
    canvas.addEventListener('pointerleave', end);
  }

  $('swatches').addEventListener('click', function (e) {
    var btn = e.target.closest('.swatch');
    if (!btn) return;
    color = btn.dataset.c;
    eraser = false;
    document.querySelectorAll('.swatch').forEach(function (b) { b.classList.toggle('active', b === btn); });
    $('eraserBtn').classList.remove('active');
  });

  var thinBtn = $('thinBtn');
  var boldBtn = $('boldBtn');
  var eraserBtn = $('eraserBtn');

  thinBtn.addEventListener('click', function () {
    thickness = 3; eraser = false;
    thinBtn.classList.add('active'); boldBtn.classList.remove('active'); eraserBtn.classList.remove('active');
  });
  boldBtn.addEventListener('click', function () {
    thickness = 7; eraser = false;
    boldBtn.classList.add('active'); thinBtn.classList.remove('active'); eraserBtn.classList.remove('active');
  });
  eraserBtn.addEventListener('click', function () {
    eraser = !eraser;
    eraserBtn.classList.toggle('active', eraser);
  });

  function clearBoard(b) {
    var rect = b.canvas.getBoundingClientRect();
    b.ctx.clearRect(0, 0, rect.width, rect.height);
  }

  document.querySelectorAll('.field-clear').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var canvas = document.getElementById(btn.dataset.target);
      var b = boards.find(function (x) { return x.canvas === canvas; });
      if (b) clearBoard(b);
    });
  });

  $('clearAllBtn').addEventListener('click', function () {
    boards.forEach(clearBoard);
  });

  // ---- 내보내기: 각 필드 잉크를 실제 서식(form.jpg) 위 해당 칸에 합성 ----
  function drawFieldInto(ctx, canvas, cell) {
    var iw = canvas.width, ih = canvas.height;
    if (iw === 0 || ih === 0) return;
    // 칸 높이에 맞추는 것을 우선한다(글씨는 대체로 가이드라인 위에 놓인다).
    var scale = cell.h / ih;
    var w = iw * scale, h = cell.h;
    // 폭이 칸을 넘치면 칸 안에 완전히 담기도록 최소 배율로 다시 맞춘다.
    if (w > cell.w) {
      scale = Math.min(cell.w / iw, cell.h / ih);
      w = iw * scale;
      h = ih * scale;
    }
    var dx = cell.x; // 칸 왼쪽에 정렬
    var dy = cell.y + (cell.h - h) / 2; // 칸 안에서 세로 중앙 정렬
    ctx.drawImage(canvas, 0, 0, iw, ih, dx, dy, w, h);
  }

  function buildComposite() {
    var out = document.createElement('canvas');
    out.width = 707;
    out.height = 1000;
    var ctx = out.getContext('2d');
    ctx.drawImage(formImage, 0, 0, 707, 1000);
    boards.forEach(function (b) {
      var key = b.canvas.id.replace(/^c-/, '');
      var cell = CELLS[key];
      if (!cell) return;
      drawFieldInto(ctx, b.canvas, cell);
    });
    return out;
  }

  function toJpegFile() {
    var stamp = new Date().toLocaleDateString('sv-SE').replace(/-/g, '');
    var out = buildComposite();
    return new Promise(function (resolve, reject) {
      out.toBlob(function (blob) {
        if (!blob) { reject(new Error('이미지 생성에 실패했습니다.')); return; }
        resolve(new File([blob], '게스트하우스신청서_' + stamp + '.jpg', { type: 'image/jpeg' }));
      }, 'image/jpeg', 0.92);
    });
  }

  function downloadFile(file) {
    var url = URL.createObjectURL(file);
    var a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  $('sendBtn').addEventListener('click', function () {
    if (imageState !== 'ready') return;
    toJpegFile().then(function (file) {
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: '게스트하우스 신청서' }).then(function () {
          setStatus('');
        }).catch(function (err) {
          if (err && err.name === 'AbortError') { setStatus(''); return; }
          setStatus('공유하지 못했습니다. "이미지 저장"을 눌러 저장한 뒤 문자메시지에 직접 첨부해 주세요.');
        });
        return;
      }
      setStatus('이 브라우저는 공유를 지원하지 않습니다. "이미지 저장"을 눌러 주세요.');
    }).catch(function (err) {
      setStatus('이미지를 만들지 못했습니다: ' + err.message);
    });
  });

  $('saveBtn').addEventListener('click', function () {
    if (imageState !== 'ready') return;
    toJpegFile().then(function (file) {
      // 폰에서는 <a download>로 사진함에 저장되지 않는다. 공유 시트를 열면
      // 사용자가 '이미지 저장'을 눌러 사진함에 바로 저장할 수 있다.
      if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
        navigator.share({ files: [file], title: '게스트하우스 신청서' }).then(function () {
          setStatus('');
        }).catch(function (err) {
          if (err && err.name === 'AbortError') { setStatus(''); return; }
          setStatus('저장하지 못했습니다. 다시 시도해 주세요.');
        });
        return;
      }
      // 공유 파일이 지원되지 않는 환경(주로 PC)에서는 파일로 내려받는다.
      downloadFile(file);
      setStatus('');
      showToast('저장했습니다.');
    }).catch(function (err) {
      setStatus('이미지를 만들지 못했습니다: ' + err.message);
    });
  });

  syncButtons();
})();
</script>
</body>
</html>
