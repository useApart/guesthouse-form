<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게스트하우스 신청서 (직접 쓰기)</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 16px;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    background: #f4f5f7; color: #222;
  }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  .back-link { display: inline-block; margin-bottom: 16px; font-size: 13px; color: #2f6fed; text-decoration: none; }
  .back-link:hover { text-decoration: underline; }
  .stage {
    position: relative; overflow: hidden;
  }
  canvas {
    width: 100%; height: auto; display: block;
    border: 1px solid #ccc; background: #fff; touch-action: none;
  }
  .zoom-row button {
    min-height: 36px; padding: 6px 10px; font-size: 14px;
  }
  .summary { margin: 0; font-size: 13px; color: #555; }
  .toolbar {
    display: grid; gap: 8px; margin: 12px 0;
    padding: 10px; background: #fff; border: 1px solid #d8dade; border-radius: 6px;
  }
  .tool-row { display: grid; grid-auto-flow: column; gap: 8px; align-items: center; }
  .tool-row .label { font-size: 12px; color: #666; width: 44px; flex: none; }
  .swatch {
    width: 36px; height: 36px; min-height: 36px; padding: 0; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer; position: relative;
  }
  .swatch.active { border-color: #2f6fed; box-shadow: 0 0 0 2px #fff inset; }
  .actions { display: grid; grid-auto-flow: column; gap: 8px; margin-bottom: 12px; }
  button {
    font: inherit; font-size: 15px; padding: 12px; border-radius: 6px;
    border: 1px solid #c4c7cc; background: #fff; cursor: pointer; min-height: 44px;
  }
  button.primary { background: #2f6fed; border-color: #2f6fed; color: #fff; font-weight: bold; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button.toggle.active { background: #2f6fed; border-color: #2f6fed; color: #fff; font-weight: bold; }
</style>
</head>
<body>
<main>
  <h1>게스트하우스 신청서 (직접 쓰기)</h1>
  <a class="back-link" href="index.html">← 타이핑으로 작성</a>

  <div class="stage" id="stage">
    <canvas id="canvas" width="707" height="1000"></canvas>
  </div>

  <div class="toolbar">
    <div class="tool-row zoom-row">
      <span class="label">화면</span>
      <button type="button" id="zoomIn">확대(＋)</button>
      <button type="button" id="zoomOut">축소(−)</button>
      <button type="button" id="zoomReset">원래대로</button>
    </div>
    <div class="tool-row">
      <span class="label">색</span>
      <button type="button" class="swatch active" id="colorBlack" style="background:#000000" aria-label="검정"></button>
      <button type="button" class="swatch" id="colorBlue" style="background:#1a3fae" aria-label="파랑"></button>
      <button type="button" class="swatch" id="colorRed" style="background:#c0392b" aria-label="빨강"></button>
    </div>
    <div class="tool-row">
      <span class="label">굵기</span>
      <button type="button" class="toggle active" id="widthThin">얇게</button>
      <button type="button" class="toggle" id="widthThick">굵게</button>
      <button type="button" class="toggle" id="eraser">지우개</button>
    </div>
    <div class="tool-row">
      <button type="button" id="undo" disabled>되돌리기</button>
      <button type="button" id="clearAll">전체 지우기</button>
    </div>
  </div>

  <div class="actions">
    <button type="button" id="share" class="primary" disabled>이미지 만들어 보내기</button>
    <button type="button" id="download" disabled>이미지 저장</button>
  </div>
  <p id="status" class="summary"></p>
</main>

<script type="module">
const canvas = document.getElementById('canvas');
const stage = document.getElementById('stage');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// 오프스크린 잉크 캔버스. 사용자가 그린 획은 오직 여기에만 그려서
// 지우개가 서식 이미지를 절대 지우지 못하게 한다.
const inkCanvas = document.createElement('canvas');
inkCanvas.width = W;
inkCanvas.height = H;
const inkCtx = inkCanvas.getContext('2d');

// 'loading' | 'ready' | 'error'
let imageState = 'loading';

const formImage = new Image();
const imageReady = new Promise((resolve, reject) => {
  formImage.onload = () => { imageState = 'ready'; resolve(); };
  formImage.onerror = () => {
    imageState = 'error';
    reject(new Error('서식 이미지를 불러오지 못했습니다.'));
  };
});
formImage.src = 'form.jpg';

function redraw() {
  ctx.clearRect(0, 0, W, H);
  if (imageState !== 'ready') return;
  try {
    ctx.drawImage(formImage, 0, 0, W, H);
  } catch {
    imageState = 'error';
    return;
  }
  ctx.drawImage(inkCanvas, 0, 0);
}

const $ = (id) => document.getElementById(id);

function setStatus(msg) { $('status').textContent = msg; }

function syncButtons() {
  const blocked = imageState !== 'ready';
  $('share').disabled = blocked;
  $('download').disabled = blocked;
  if (imageState === 'error') {
    setStatus('서식 이미지를 불러오지 못했습니다. 새로고침해 주세요.');
  } else if (imageState === 'loading') {
    setStatus('서식 이미지를 불러오는 중입니다...');
  } else {
    setStatus('');
  }
}

// ---- 도구 상태 ----
let currentColor = '#000000';
let currentWidth = 3;
let erasing = false;

const colorButtons = {
  '#000000': $('colorBlack'),
  '#1a3fae': $('colorBlue'),
  '#c0392b': $('colorRed'),
};

function setColor(color) {
  currentColor = color;
  erasing = false;
  for (const [c, btn] of Object.entries(colorButtons)) {
    btn.classList.toggle('active', c === color);
  }
  $('eraser').classList.remove('active');
}

$('colorBlack').addEventListener('click', () => setColor('#000000'));
$('colorBlue').addEventListener('click', () => setColor('#1a3fae'));
$('colorRed').addEventListener('click', () => setColor('#c0392b'));

function setWidth(w) {
  currentWidth = w;
  $('widthThin').classList.toggle('active', w === 3);
  $('widthThick').classList.toggle('active', w === 7);
}
$('widthThin').addEventListener('click', () => setWidth(3));
$('widthThick').addEventListener('click', () => setWidth(7));

$('eraser').addEventListener('click', () => {
  erasing = !erasing;
  $('eraser').classList.toggle('active', erasing);
});

// ---- 되돌리기 스택 ----
const UNDO_LIMIT = 12;
let undoStack = [];

function pushUndoSnapshot() {
  undoStack.push(inkCtx.getImageData(0, 0, W, H));
  if (undoStack.length > UNDO_LIMIT) undoStack.shift();
  $('undo').disabled = false;
}

$('undo').addEventListener('click', () => {
  const snapshot = undoStack.pop();
  if (!snapshot) return;
  inkCtx.putImageData(snapshot, 0, 0);
  redraw();
  $('undo').disabled = undoStack.length === 0;
});

$('clearAll').addEventListener('click', () => {
  pushUndoSnapshot();
  inkCtx.clearRect(0, 0, W, H);
  redraw();
});

// ---- 그리기 (포인터 이벤트: 손가락/마우스/스타일러스 공용) ----
let drawing = false;
let lastX = 0, lastY = 0;

function toCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left) * (canvas.width / rect.width),
    y: (e.clientY - rect.top) * (canvas.height / rect.height),
  };
}

function strokeSegment(x0, y0, x1, y1) {
  inkCtx.globalCompositeOperation = erasing ? 'destination-out' : 'source-over';
  inkCtx.strokeStyle = currentColor;
  inkCtx.lineWidth = currentWidth;
  inkCtx.lineCap = 'round';
  inkCtx.lineJoin = 'round';
  inkCtx.beginPath();
  inkCtx.moveTo(x0, y0);
  inkCtx.lineTo(x1, y1);
  inkCtx.stroke();
}

// ---- 확대/축소 (핀치줌 + 버튼) ----
// 캔버스는 CSS transform으로만 확대/이동한다. 픽셀 데이터(707x1000)는
// 그대로이므로 toCanvasCoords()의 getBoundingClientRect() 기반 계산과
// 내보내기(toBlob)는 줌과 무관하게 항상 정확하다.
let scale = 1, tx = 0, ty = 0;
const MIN_SCALE = 1, MAX_SCALE = 5;

function applyTransform() {
  canvas.style.transformOrigin = '0 0';
  canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
}

function clamp(v, lo, hi) { return Math.min(hi, Math.max(lo, v)); }

// scale/tx/ty를 정리한다: 1에 가까우면 딱 맞춤 상태로 스냅하고,
// 그 외에는 캔버스가 스테이지 밖으로 완전히 벗어나지 않도록 clamp한다.
function normalizeTransform() {
  scale = clamp(scale, MIN_SCALE, MAX_SCALE);
  if (scale <= MIN_SCALE + 0.02) {
    scale = 1; tx = 0; ty = 0;
    return;
  }
  const baseW = stage.clientWidth;
  const baseH = stage.clientHeight;
  const scaledW = baseW * scale;
  const scaledH = baseH * scale;
  tx = clamp(tx, baseW - scaledW, 0);
  ty = clamp(ty, baseH - scaledH, 0);
}

// 스테이지 중심을 고정한 채 배율만 factor만큼 바꾼다 (버튼용).
function zoomByFactor(factor) {
  const baseW = stage.clientWidth;
  const baseH = stage.clientHeight;
  const cx = baseW / 2, cy = baseH / 2;
  const oldScale = scale;
  const newScale = clamp(oldScale * factor, MIN_SCALE, MAX_SCALE);
  const contentX = (cx - tx) / oldScale;
  const contentY = (cy - ty) / oldScale;
  scale = newScale;
  tx = cx - contentX * newScale;
  ty = cy - contentY * newScale;
  normalizeTransform();
  applyTransform();
}

$('zoomIn').addEventListener('click', () => zoomByFactor(1.3));
$('zoomOut').addEventListener('click', () => zoomByFactor(1 / 1.3));
$('zoomReset').addEventListener('click', () => {
  scale = 1; tx = 0; ty = 0;
  applyTransform();
});

// ---- 포인터(손가락) 추적: 1개=그리기, 2개=핀치줌/이동 ----
const pointers = new Map(); // pointerId -> {x, y} (clientX/clientY)
let capturedPointerId = null;
let gesture = null; // {dist, midX, midY, scale, tx, ty} (스테이지 기준 좌표)

function stagePoint(clientX, clientY) {
  const r = stage.getBoundingClientRect();
  return { x: clientX - r.left, y: clientY - r.top };
}

function firstTwoPointers() {
  const vals = [...pointers.values()];
  return [vals[0], vals[1]];
}

function startGesture() {
  const [p0, p1] = firstTwoPointers();
  const a = stagePoint(p0.x, p0.y);
  const b = stagePoint(p1.x, p1.y);
  gesture = {
    dist: Math.hypot(b.x - a.x, b.y - a.y) || 1,
    midX: (a.x + b.x) / 2,
    midY: (a.y + b.y) / 2,
    scale, tx, ty,
  };
}

// 진행 중이던 한 손가락 획을 취소하고, 되돌리기 스택에 남긴 스냅샷도 되돌린다.
function cancelInProgressStroke() {
  if (!drawing) return;
  const snapshot = undoStack.pop();
  if (snapshot) inkCtx.putImageData(snapshot, 0, 0);
  redraw();
  $('undo').disabled = undoStack.length === 0;
  drawing = false;
}

canvas.addEventListener('pointerdown', (e) => {
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  e.preventDefault();

  if (pointers.size === 1) {
    if (imageState !== 'ready') return;
    canvas.setPointerCapture(e.pointerId);
    capturedPointerId = e.pointerId;
    pushUndoSnapshot();
    drawing = true;
    const { x, y } = toCanvasCoords(e);
    lastX = x; lastY = y;
    // 점만 찍어도 자국이 남도록 같은 점에 짧은 선을 그린다.
    strokeSegment(x, y, x, y);
    redraw();
  } else if (pointers.size === 2) {
    if (capturedPointerId !== null) {
      try { canvas.releasePointerCapture(capturedPointerId); } catch { /* noop */ }
      capturedPointerId = null;
    }
    cancelInProgressStroke();
    startGesture();
  } else if (pointers.size > 2 && gesture) {
    // 세 번째 이상 손가락은 무시하되, 기존 두 손가락 기준으로 계속 진행한다.
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!pointers.has(e.pointerId)) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  e.preventDefault();

  if (pointers.size >= 2 && gesture) {
    const [p0, p1] = firstTwoPointers();
    const a = stagePoint(p0.x, p0.y);
    const b = stagePoint(p1.x, p1.y);
    const dist = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    const midX = (a.x + b.x) / 2;
    const midY = (a.y + b.y) / 2;
    const newScale = clamp(gesture.scale * (dist / gesture.dist), MIN_SCALE, MAX_SCALE);
    // 시작 중점 아래에 있던 컨텐츠 지점이 현재 중점 아래에 계속 오도록 tx/ty를 갱신한다.
    tx = midX - (gesture.midX - gesture.tx) * (newScale / gesture.scale);
    ty = midY - (gesture.midY - gesture.ty) * (newScale / gesture.scale);
    scale = newScale;
    normalizeTransform();
    applyTransform();
    return;
  }

  if (!drawing) return;
  const { x, y } = toCanvasCoords(e);
  strokeSegment(lastX, lastY, x, y);
  lastX = x; lastY = y;
  redraw();
});

function endPointer(e) {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  e.preventDefault();

  if (capturedPointerId === e.pointerId) {
    try { canvas.releasePointerCapture(e.pointerId); } catch { /* noop */ }
    capturedPointerId = null;
  }

  if (pointers.size === 2) {
    // 세 손가락 중 하나를 뗀 경우: 남은 두 손가락으로 제스처 기준을 다시 잡는다.
    startGesture();
  } else if (pointers.size === 1) {
    // 두 손가락 -> 한 손가락: 제스처를 끝내고, 남은 손가락으로는 그리지 않는다.
    gesture = null;
    drawing = false;
  } else if (pointers.size === 0) {
    gesture = null;
    drawing = false;
  }
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);

// ---- 내보내기 (신청일 필드가 없으므로 오늘 날짜로 파일명 생성) ----
function toJpegFile() {
  const stamp = new Date().toLocaleDateString('sv-SE').replace(/-/g, '');
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      (blob) => {
        if (!blob) return reject(new Error('이미지 생성에 실패했습니다.'));
        resolve(new File([blob], `게스트하우스신청서_${stamp}.jpg`, { type: 'image/jpeg' }));
      },
      'image/jpeg',
      0.92
    );
  });
}

$('share').addEventListener('click', async () => {
  try {
    const file = await toJpegFile();
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '게스트하우스 신청서' });
      setStatus('');
      return;
    }
    setStatus('이 브라우저는 공유를 지원하지 않습니다. "이미지 저장"을 눌러 주세요.');
  } catch (err) {
    if (err.name === 'AbortError') { setStatus(''); return; }
    setStatus('공유하지 못했습니다. "이미지 저장"을 눌러 저장한 뒤 문자메시지에 직접 첨부해 주세요.');
  }
});

$('download').addEventListener('click', async () => {
  try {
    const file = await toJpegFile();
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setStatus('저장했습니다.');
  } catch (err) {
    setStatus(`이미지를 만들지 못했습니다: ${err.message}`);
  }
});

// 최상위 await를 쓰지 않는다 — 구형 브라우저에서 모듈 파싱이 실패하는 것을 피한다.
applyTransform();
redraw();
syncButtons();
imageReady.then(() => { redraw(); syncButtons(); }).catch(() => { syncButtons(); });
</script>
</body>
</html>
