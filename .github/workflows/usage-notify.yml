name: 일일 사용량 알림

on:
  schedule:
    # UTC 22:37 = KST 07:37. 정시(0분)를 쓰면 안 된다 — 전 세계 cron이 그 순간에
    # 몰려서 GitHub이 예약 실행을 늦추거나 아예 만들지 않는다. 실제로 정시로
    # 뒀을 때 첫날은 47분 늦게 돌고 2026-08-06분은 실행 자체가 누락됐다.
    # 일일 집계라 도착이 몇 분 늦는 것은 상관없다.
    - cron: '37 22 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/notify-usage.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
