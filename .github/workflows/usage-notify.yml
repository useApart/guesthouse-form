name: 일일 사용량 알림

on:
  schedule:
    # UTC 15:07 = KST 00:07. 날짜가 바뀌자마자 방금 끝난 하루를 보낸다.
    #
    # 정각(0분)을 쓰면 안 된다 — 전 세계 cron이 그 순간에 몰려서 GitHub이 예약
    # 실행을 늦추거나 아예 만들지 않는다. 실제로 정시로 뒀을 때 첫날은 47분 늦게
    # 돌고 2026-08-06분은 실행 자체가 누락됐다.
    #
    # 밀려도 안전하다. seoulYesterday()가 한국 시간 기준으로 날짜를 정하므로,
    # 그날이 가기 전(KST 23:59)에만 돌면 집계 대상은 그대로다.
    - cron: '7 15 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/notify-usage.mjs
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
