<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>게스트하우스 예약 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #F5F4F0; color: #1E251E; }
  .wrap { min-height: 100vh; display: flex; justify-content: center; padding: 28px 16px 64px; }
  .inner { width: 100%; max-width: 620px; }
  .eyebrow { text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: #7A8177; margin-bottom: 6px; }
  h1 { text-align: center; margin: 0 0 20px; font-size: 24px; font-weight: 700; letter-spacing: -.01em; }
  h2 { font-size: 15px; font-weight: 700; margin: 0 0 12px; color: #3C443B; }
  .card { background: #fff; border-radius: 20px; border: 1px solid #E8E6DE; box-shadow: 0 1px 3px rgba(30,37,30,.04); padding: 22px; margin-bottom: 16px; }
  .card[hidden] { display: none; }
  label { font-size: 13px; font-weight: 600; color: #3C443B; display: block; margin-bottom: 5px; }
  input[type="email"], input[type="password"] {
    height: 46px; width: 100%; border-radius: 10px; border: 1px solid #DDDBD2; padding: 0 12px;
    font-size: 16px; font-family: inherit; color: #1E251E; background: #fff;
  }
  .field { margin-bottom: 14px; }
  .hint { font-size: 13px; color: #7A8177; margin: 6px 0 0; line-height: 1.6; }
  .btn { height: 48px; padding: 0 18px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; border: none; }
  .btn-primary { background: #1F6D57; color: #fff; }
  .btn-primary:hover { background: #195C49; }
  .btn-secondary { background: #fff; color: #3C443B; border: 1px solid #D8D6CD; }
  .btn-secondary:hover { background: #F5F4F0; }
  .btn-danger { background: #fff; color: #B5473A; border: 1px solid #E4C9C4; }
  .btn-danger:hover { background: #FDF5F4; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-full { width: 100%; }
  .btn-row { display: flex; gap: 10px; }
  .btn-row .btn { flex: 1; }

  /* ---- 예약 카드 ---- */
  .res { border: 1px solid #E2E0D8; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .res.pending { border-color: #EBD3AE; background: #FEFBF6; }
  .res-when { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .res-who { font-size: 15px; color: #3C443B; margin-bottom: 2px; }
  .res-phone { font-size: 15px; color: #3C443B; }
  .res-phone a { color: #1F6D57; }
  .res-money { font-size: 20px; font-weight: 700; margin: 10px 0 0; }
  .res-mismatch { color: #C0392B; font-size: 13px; font-weight: 700; margin-top: 6px; line-height: 1.5; }
  .res-amount { display: flex; align-items: center; gap: 8px; margin: 12px 0 0; }
  .res-amount input { width: 130px; height: 42px; padding: 0 10px; border-radius: 10px; border: 1px solid #DDDBD2; background: #fff; color: #3C443B; font-size: 19px; font-weight: 700; font-family: inherit; text-align: right; }
  .res-amount .won { font-size: 17px; font-weight: 700; }
  .res-holiday { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: #3C443B; margin-top: 8px; cursor: pointer; }
  .res-holiday input { width: 18px; height: 18px; margin: 0; }
  .res-actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .res-actions .btn { flex: 1; height: 46px; }
  .res-move { flex: 1; height: 46px; padding: 0 10px; border-radius: 10px; border: 1px solid #DDDBD2; background: #fff; color: #3C443B; font-size: 14px; font-family: inherit; cursor: pointer; }
  .empty { font-size: 14px; color: #9A9F92; text-align: center; padding: 20px 0; }

  /* ---- 세대 이용 이력 ---- */
  .res-history { margin-top: 12px; padding-top: 12px; border-top: 1px solid #F0EEE7; }
  .res-history-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .res-history-sum { font-size: 14px; color: #3C443B; }
  .res-history-sum strong { font-weight: 700; }
  .res-history-toggle { border: none; background: none; color: #1F6D57; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; padding: 4px; }
  .res-history-list { margin-top: 10px; font-size: 13px; color: #7A8177; line-height: 1.8; }
  .res-history-list div { display: flex; justify-content: space-between; gap: 10px; }
  .res-history-list .cancelled { text-decoration: line-through; color: #B9BDB4; }

  .toolbar { display: flex; gap: 8px; margin-bottom: 16px; }
  .toolbar .btn { flex: 1; height: 42px; font-size: 14px; }

  /* 탭. admin.html과 같은 값을 쓴다 — 새 디자인을 만들지 않는다. */
  .tabs { display: flex; background: #EAE8E1; border-radius: 14px; padding: 4px; margin-bottom: 16px; gap: 4px; }
  .tab { flex: 1; height: 44px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; background: transparent; color: #7A8177; }
  .tab.active { background: #fff; color: #1F6D57; box-shadow: 0 1px 2px rgba(30,37,30,.08); }

  /* ---- 달력 ---- */
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-nav { width: 40px; height: 40px; border: none; background: #F5F4F0; border-radius: 10px; font-size: 18px; font-weight: 700; color: #3C443B; cursor: pointer; font-family: inherit; }
  .cal-nav:hover { background: #EAE8E1; }
  .cal-label { font-size: 17px; font-weight: 700; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: #7A8177; margin-bottom: 4px; }
  .cal-week span:first-child { color: #C0392B; }
  .cal-week span:last-child { color: #2E5AA8; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-blank { min-height: 62px; }
  .cal-day {
    min-height: 62px; border: none; background: none; border-radius: 8px; padding: 5px 3px;
    font-family: inherit; font-size: 13px; color: #1E251E; cursor: pointer;
    display: flex; flex-direction: column; align-items: stretch; gap: 2px; overflow: hidden;
  }
  .cal-day:hover { background: #F5F4F0; }
  .cal-day.sun { color: #C0392B; }
  .cal-day.sat { color: #2E5AA8; }
  .cal-day.today { box-shadow: inset 0 0 0 1.5px #1F6D57; }
  .cal-day.picked { background: #F5F4F0; }
  .cal-day .num { text-align: center; }
  /* 색은 1단계에서 쓰던 값 그대로다. 대기 카드에서 본 노랑을 달력에서
     다시 만나면 설명 없이 알아본다. */
  .chip {
    font-size: 10px; line-height: 15px; border-radius: 3px; padding: 0 3px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left;
  }
  .chip.confirmed { background: #EAF3EF; color: #1F6D57; }
  .chip.pending { background: #FDF3E7; color: #7A5A22; }
  .cal-legend { display: flex; justify-content: center; gap: 16px; margin-top: 12px; font-size: 12px; color: #7A8177; }
  .cal-legend span { display: flex; align-items: center; gap: 5px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; }
  .dot.confirmed { background: #EAF3EF; box-shadow: inset 0 0 0 1px #1F6D57; }
  .dot.pending { background: #FDF3E7; box-shadow: inset 0 0 0 1px #7A5A22; }

  /* ---- 지난 예약 검색 ---- */
  .search-row { display: flex; align-items: center; gap: 8px; }
  .search-row input { flex: 1; min-width: 0; height: 46px; border: 1px solid #DDDBD2; border-radius: 10px; padding: 0 12px; font-size: 16px; font-family: inherit; color: #1E251E; background: #fff; }
  .search-row .dash { color: #9A9F92; font-weight: 600; }
  .search-row .btn { flex: 0 0 auto; height: 46px; }
  .hist-row { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid #F0EEE7; font-size: 14px; }
  .hist-row:last-child { border-bottom: none; }
  .hist-row.cancelled { color: #B9BDB4; }
  .hist-row.cancelled .when { text-decoration: line-through; }
  .hist-when { min-width: 0; }
  .hist-what { flex: 0 0 auto; color: #7A8177; }

  /* ---- 신청서 미리보기 ---- */
  .sheet-overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 16px; }
  .sheet-overlay[hidden] { display: none; }
  .sheet-backdrop { position: absolute; inset: 0; background: rgba(30,37,30,.72); }
  .sheet-content { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 100%; max-height: 100%; }
  .sheet-content canvas { max-width: 92vw; max-height: 74vh; width: auto; height: auto; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,.35); background: #fff; }
  .sheet-actions { display: flex; gap: 10px; }
  .sheet-actions .btn { min-width: 120px; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: #1E251E; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; text-align: center; z-index: 200; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <div class="eyebrow">관리사무소</div>
    <h1>게스트하우스 예약</h1>

    <section class="card" id="offCard" hidden>
      <p class="hint" id="offText"></p>
    </section>

    <section class="card" id="loginCard" hidden>
      <h2>로그인</h2>
      <div class="field"><label for="email">이메일</label><input type="email" id="email" autocomplete="username"></div>
      <div class="field"><label for="password">비밀번호</label><input type="password" id="password" autocomplete="current-password"></div>
      <button type="button" class="btn btn-primary btn-full" id="loginBtn">로그인</button>
      <p class="hint" id="loginMsg"></p>
    </section>

    <section id="listArea" hidden>
      <div class="toolbar">
        <button type="button" class="btn btn-secondary" id="reloadBtn">새로고침</button>
        <button type="button" class="btn btn-secondary" id="logoutBtn">로그아웃</button>
      </div>

      <div class="tabs">
        <button class="tab active" data-tab="pending" type="button" id="tabPendingBtn">확인 필요</button>
        <button class="tab" data-tab="calendar" type="button" id="tabCalendarBtn">달력</button>
        <button class="tab" data-tab="history" type="button" id="tabHistoryBtn">지난 예약</button>
      </div>

      <div id="tabPending">
        <div class="card">
          <h2 id="pendingTitle">확인 필요</h2>
          <div id="pendingList"></div>
        </div>

        <div class="card">
          <h2>확정된 예약</h2>
          <div id="confirmedList"></div>
        </div>
      </div>

      <div id="tabCalendar" hidden>
        <div class="card">
          <div class="cal-head">
            <button type="button" class="cal-nav" id="calPrev" aria-label="이전 달">‹</button>
            <div class="cal-label" id="calLabel"></div>
            <button type="button" class="cal-nav" id="calNext" aria-label="다음 달">›</button>
          </div>
          <div class="cal-week">
            <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
          </div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="cal-legend">
            <span><i class="dot confirmed"></i> 확정</span>
            <span><i class="dot pending"></i> 확인 필요</span>
          </div>
        </div>

        <div class="card" id="dayCard" hidden>
          <h2 id="dayTitle"></h2>
          <div id="dayList"></div>
        </div>
      </div>

      <div id="tabHistory" hidden>
        <div class="card">
          <h2>세대로 찾기</h2>
          <div class="search-row">
            <input type="text" id="qDong" inputmode="numeric" placeholder="동" maxlength="4">
            <span class="dash">-</span>
            <input type="text" id="qHo" inputmode="numeric" placeholder="호" maxlength="3">
            <button type="button" class="btn btn-secondary" id="searchUnitBtn">찾기</button>
          </div>

          <h2 style="margin-top:20px;">이름으로 찾기</h2>
          <div class="search-row">
            <input type="text" id="qName" placeholder="성명">
            <button type="button" class="btn btn-secondary" id="searchNameBtn">찾기</button>
          </div>
        </div>

        <div class="card" id="resultCard" hidden>
          <h2 id="resultTitle"></h2>
          <div id="resultList"></div>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="sheet-overlay" id="sheetOverlay" hidden>
  <div class="sheet-backdrop" id="sheetBackdrop"></div>
  <div class="sheet-content">
    <canvas id="sheetCanvas"></canvas>
    <div class="sheet-actions">
      <button type="button" class="btn btn-primary" id="sheetSave">이미지 저장</button>
      <button type="button" class="btn btn-secondary" id="sheetClose">닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { countNights, calcAmount } from './calc.js';
import { DEFAULT_CONFIG, clone, loadConfig, printedCells, rectToPoint } from './config.js';
import {
  signIn, listReservations, patchReservation, setHouse,
  findByHousehold, findByName, summarize, monthGrid,
  bookedNights, isHouseFree, CONFLICT_OVERLAP,
} from './reservations.js';
import { detectMobile } from './device.js';

const $ = (id) => document.getElementById(id);

// 폰이면 저장에 공유 시트를 쓴다(사진함). PC면 파일로 내려받는다.
// 관리사무소는 거의 항상 PC라 이 화면에서는 사실상 다운로드 경로만 쓰인다.
const isMobile = detectMobile();

const TOKEN_KEY = 'guesthouse-staff-token';

// 배지에 쓰는 기간. 이용 횟수 제한이 없어 판단 기준이 아니라 참고용이므로
// 설정으로 빼지 않는다. 다른 기간을 보고 싶다는 요청이 오면 그때 옮긴다.
const HISTORY_MONTHS = 6;

let config = clone(DEFAULT_CONFIG);
let accessToken = '';
try { accessToken = localStorage.getItem(TOKEN_KEY) || ''; } catch { accessToken = ''; }

// 마지막으로 받은 전체 예약(취소 포함). 달력과 검색이 같은 데이터를 쓴다.
let allRows = [];
let activeTab = 'pending';

let toastTimer;
function showToast(msg) {
  const toast = $('toast');
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  const ms = Math.min(8000, Math.max(2600, msg.length * 110));
  toastTimer = setTimeout(() => toast.classList.remove('show'), ms);
}

function el(tag, className, props) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  Object.assign(node, props || {});
  return node;
}

function houseLabel(id) {
  const h = config.houses.find((x) => x.id === id);
  return h ? h.label : id;
}

// 'YYYY-MM-DD' -> 'M월 D일'
function humanDate(s) {
  if (!s) return '';
  const [, m, d] = s.split('-').map(Number);
  return `${m}월 ${d}일`;
}

// 'YYYY-MM-DD' -> 'YYYY.M.D'. 서식 칸이 좁아 앞자리 0을 뗀다.
function compactDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  return `${y}.${m}.${d}`;
}

// 입실일·퇴실일로 사용기간 문자열. 연도는 앞에 한 번만 쓰고 월·일의 앞자리 0은 뗀다.
function shortDate(checkIn, checkOut) {
  if (!checkIn || !checkOut) return '';
  const [y1, m1, d1] = checkIn.split('-').map(Number);
  const [y2, m2, d2] = checkOut.split('-').map(Number);
  const end = y1 === y2 ? `${m2}.${d2}` : `${y2}.${m2}.${d2}`;
  return `${y1}.${m1}.${d1} ~ ${end}`;
}

// ---- 로그인 ----

function showLogin(msg) {
  $('listArea').hidden = true;
  $('loginCard').hidden = false;
  if (msg) $('loginMsg').textContent = msg;
}

function showList() {
  $('loginCard').hidden = true;
  $('listArea').hidden = false;
  loadList();
}

function logout() {
  accessToken = '';
  try { localStorage.removeItem(TOKEN_KEY); } catch { /* 저장 막힌 환경 */ }
  $('email').value = '';
  $('password').value = '';
  showLogin('');
}

$('loginBtn').addEventListener('click', () => {
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) { $('loginMsg').textContent = '이메일과 비밀번호를 입력해 주세요.'; return; }

  $('loginBtn').disabled = true;
  $('loginMsg').textContent = '';
  signIn(config.reservation, email, password)
    .then((session) => {
      accessToken = session.access_token;
      try { localStorage.setItem(TOKEN_KEY, accessToken); } catch { /* 저장 막힌 환경 */ }
      showList();
    })
    .catch(() => { $('loginMsg').textContent = '이메일 또는 비밀번호가 맞지 않습니다.'; })
    .finally(() => { $('loginBtn').disabled = false; });
});

$('password').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
$('logoutBtn').addEventListener('click', logout);
$('reloadBtn').addEventListener('click', () => loadList());

// ---- 목록 ----

function renderRow(row, host) {
  const box = el('div', `res${row.status === 'pending' ? ' pending' : ''}`);
  const nights = countNights(row.check_in, row.check_out);

  // 대기 신청도 자리는 잡아두지만 최종 배정은 아니다. 그냥 'B동'이라고 쓰면
  // 확정된 것처럼 보인다.
  const where = row.status === 'pending'
    ? `${houseLabel(row.house)}(배정 예정)`
    : houseLabel(row.house);
  box.appendChild(el('div', 'res-when', {
    textContent: `${where} · ${humanDate(row.check_in)} ~ ${humanDate(row.check_out)} · ${nights}박 · ${row.people}명`,
  }));
  box.appendChild(el('div', 'res-who', {
    textContent: `${row.name} · ${row.unit_dong}동 ${row.unit_ho}호`,
  }));

  const phone = el('div', 'res-phone');
  phone.appendChild(el('a', null, { href: `tel:${row.phone}`, textContent: row.phone }));
  box.appendChild(phone);

  const amount = buildAmount(row);
  box.appendChild(amount.node);

  box.appendChild(buildHistory(row));

  const actions = el('div', 'res-actions');
  actions.appendChild(makeBtn('신청서', 'btn btn-secondary', () => openSheet(row)));
  actions.appendChild(buildMove(row));
  if (row.status === 'pending') {
    // 확정과 금액 저장을 한 번에 한다. 두 번 누르게 하면 금액만 고치고 확정을
    // 잊거나 그 반대가 생긴다. 주민은 확정된 뒤에야 계좌를 보므로 이 순간의
    // 금액이 실제로 청구되는 금액이다.
    actions.appendChild(makeBtn('확정', 'btn btn-primary',
      () => change(row, 'confirmed', '확정', amount.read())));
    actions.appendChild(makeBtn('취소', 'btn btn-danger', () => change(row, 'cancelled', '취소')));
  } else {
    // 확정한 뒤에 금액이 틀린 것을 발견해도 고칠 수 있어야 한다. 예약을 취소했다
    // 다시 만들게 하면 그 사이에 날짜를 뺏긴다.
    actions.appendChild(makeBtn('금액 저장', 'btn btn-secondary',
      () => saveAmount(row, amount.read())));
    actions.appendChild(makeBtn('예약 취소', 'btn btn-danger', () => change(row, 'cancelled', '취소')));
  }
  box.appendChild(actions);

  host.appendChild(box);
}

// 저장된 금액은 주민 브라우저가 보낸 값이라 신뢰하지 않는다. RLS 정책은
// status만 검사하므로 익명 키로 amount에 0을 넣어도 DB가 받는다. 확정하는
// 사람이 금액을 정한다.
//
// 공휴일은 외부 API로 판정하지 않고 사람이 켠다. 관리사무소는 어차피 달력을
// 보고 판단하는 자리이고, API가 죽어도 동작해야 하며, 잘 돌아가는 index.html을
// 건드리지 않아도 된다.
function buildAmount(row) {
  const wrap = el('div');

  const input = el('input', null, {
    type: 'number', inputMode: 'numeric', step: '1000', min: '0', value: String(row.amount),
  });
  const line = el('div', 'res-amount');
  line.appendChild(input);
  line.appendChild(el('span', 'won', { textContent: '원' }));
  wrap.appendChild(line);

  const label = el('label', 'res-holiday');
  const holidayBox = el('input', null, { type: 'checkbox' });
  label.appendChild(holidayBox);
  label.appendChild(el('span', null, { textContent: '공휴일 요금으로 계산' }));
  wrap.appendChild(label);

  const note = el('div', 'res-mismatch');
  wrap.appendChild(note);

  const recalc = (holiday) => calcAmount(
    { checkIn: row.check_in, checkOut: row.check_out, people: row.people, holiday },
    { pricing: config.pricing }
  );

  const refreshNote = () => {
    const expected = recalc(holidayBox.checked);
    note.hidden = Number(input.value) === expected;
    note.textContent = `요금표로 계산하면 ${expected.toLocaleString('ko-KR')}원입니다.`;
  };

  holidayBox.addEventListener('change', () => {
    input.value = String(recalc(holidayBox.checked));
    refreshNote();
  });
  input.addEventListener('input', refreshNote);
  refreshNote();

  return { node: wrap, read: () => Number(input.value) };
}

// 이 세대가 전에 얼마나 썼는지. 승인 판단을 이 자리에서 끝내기 위한 것이라
// 검색 탭으로 옮기지 않는다. 승인은 매번 하는 일이고 검색은 따로 찾아 들어가는 일이다.
function buildHistory(row) {
  const wrap = el('div', 'res-history');
  const past = findByHousehold(allRows, row.unit_dong, row.unit_ho)
    .filter((r) => r.id !== row.id); // 지금 보고 있는 건은 이력이 아니다
  const sum = summarize(past, HISTORY_MONTHS);

  const head = el('div', 'res-history-head');
  const text = el('div', 'res-history-sum');
  text.innerHTML = sum.count === 0
    ? `이 세대 최근 ${HISTORY_MONTHS}개월 <strong>이용 없음</strong>`
    : `이 세대 최근 ${HISTORY_MONTHS}개월 <strong>${sum.count}회 · ${sum.nights}박</strong>`;
  head.appendChild(text);
  wrap.appendChild(head);

  if (past.length === 0) return wrap;

  const toggle = el('button', 'res-history-toggle', { type: 'button', textContent: '이력 보기' });
  const list = el('div', 'res-history-list');
  list.hidden = true;

  for (const r of past) {
    const line = el('div', r.status === 'cancelled' ? 'cancelled' : null);
    line.appendChild(el('span', null, { textContent: `${r.check_in} ~ ${r.check_out}` }));
    line.appendChild(el('span', null, {
      textContent: `${houseLabel(r.house)} · ${countNights(r.check_in, r.check_out)}박`
        + (r.status === 'cancelled' ? ' · 취소' : ''),
    }));
    list.appendChild(line);
  }

  toggle.addEventListener('click', () => {
    list.hidden = !list.hidden;
    toggle.textContent = list.hidden ? '이력 보기' : '접기';
  });
  head.appendChild(toggle);
  wrap.appendChild(list);
  return wrap;
}

function makeBtn(text, className, onClick) {
  const btn = el('button', className, { type: 'button', textContent: text });
  btn.addEventListener('click', onClick);
  return btn;
}

// 배정 변경. 대기·확정 모두 바꿀 수 있다 — 확정한 뒤에도 사정이 생겨 옮겨야 할
// 때가 있다. 옮기려는 집이 그 기간에 차 있으면 DB가 거부한다.
function buildMove(row) {
  const houses = config.houses;

  // 자기 자신은 빼고 자리 상황을 본다. 취소된 예약은 bookedNights가 걸러 준다.
  // 미리 판단해 못 옮기는 버튼을 잠근다 — DB가 최종 판정을 하지만, 눌러보고
  // 실패하는 것보다 왜 안 되는지 먼저 보이는 편이 낫다.
  const booked = bookedNights(allRows.filter((r) => r.id !== row.id));
  const free = (id) => isHouseFree(booked, id, row.check_in, row.check_out);

  if (houses.length === 2) {
    const other = houses.find((h) => h.id !== row.house) || houses[0];
    const btn = makeBtn(`${houseLabel(row.house)} → ${other.label}`, 'btn btn-secondary',
      () => move(row, other.id, other.label));
    if (!free(other.id)) {
      btn.disabled = true;
      btn.title = `그 기간에 ${other.label}은 이미 차 있습니다`;
    }
    return btn;
  }

  const select = el('select', 'res-move');
  for (const h of houses) {
    const opt = document.createElement('option');
    opt.value = h.id;
    const blocked = h.id !== row.house && !free(h.id);
    opt.textContent = blocked ? `${h.label} (찼음)` : h.label;
    opt.disabled = blocked;
    opt.selected = h.id === row.house;
    select.appendChild(opt);
  }
  select.addEventListener('change', () => {
    const picked = houses.find((h) => h.id === select.value);
    move(row, select.value, picked ? picked.label : select.value);
  });
  return select;
}

function move(row, house, label) {
  const who = `${row.name} (${row.unit_dong}동 ${row.unit_ho}호)`;
  if (!confirm(`${who}\n${humanDate(row.check_in)} ~ ${humanDate(row.check_out)}\n\n${label}으로 옮길까요?`)) {
    loadList(); // 선택 목록에서 취소했으면 원래 값으로 되돌린다
    return;
  }

  setHouse(config.reservation, accessToken, row.id, house)
    .then(() => { showToast(`${label}으로 옮겼습니다.`); return loadList(); })
    .catch((err) => {
      if (err.status === 401 || err.status === 403) { logout(); showLogin('다시 로그인해 주세요.'); return; }
      if (err.code === CONFLICT_OVERLAP) showToast(`그 기간에 ${label}은 이미 예약이 있습니다.`);
      else showToast(`옮기지 못했습니다: ${err.message}`);
      loadList();
    });
}

// amount를 넘기면 상태와 함께 저장한다. 확정이 곧 금액 확정이다.
function change(row, status, label, amount) {
  const who = `${row.name} (${row.unit_dong}동 ${row.unit_ho}호)`;
  const money = amount === undefined ? '' : `\n금액 ${amount.toLocaleString('ko-KR')}원`;
  if (!confirm(`${who}\n${humanDate(row.check_in)} ~ ${humanDate(row.check_out)}${money}\n\n이 예약을 ${label}할까요?`)) return;

  const patch = amount === undefined ? { status } : { status, amount };
  patchReservation(config.reservation, accessToken, row.id, patch)
    .then(() => { showToast(`${label}했습니다.`); return loadList(); })
    .catch((err) => {
      if (err.status === 401) { logout(); showLogin('다시 로그인해 주세요.'); return; }
      showToast(`처리하지 못했습니다: ${err.message}`);
    });
}

function saveAmount(row, amount) {
  if (amount === row.amount) { showToast('금액이 그대로입니다.'); return; }
  patchReservation(config.reservation, accessToken, row.id, { amount })
    .then(() => { showToast(`${amount.toLocaleString('ko-KR')}원으로 저장했습니다.`); return loadList(); })
    .catch((err) => {
      if (err.status === 401) { logout(); showLogin('다시 로그인해 주세요.'); return; }
      showToast(`저장하지 못했습니다: ${err.message}`);
    });
}

// ---- 탭 ----

function showTab(name) {
  activeTab = name;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === name));
  $('tabPending').hidden = name !== 'pending';
  $('tabCalendar').hidden = name !== 'calendar';
  $('tabHistory').hidden = name !== 'history';
  if (name === 'calendar') renderCalendar();
  if (name === 'history') renderHistory();
}

$('tabPendingBtn').addEventListener('click', () => showTab('pending'));
$('tabCalendarBtn').addEventListener('click', () => showTab('calendar'));
$('tabHistoryBtn').addEventListener('click', () => showTab('history'));

function loadList() {
  return listReservations(config.reservation, accessToken)
    .then((rows) => {
      allRows = rows;
      const pending = rows.filter((r) => r.status === 'pending');
      const confirmed = rows.filter((r) => r.status === 'confirmed');

      $('pendingTitle').textContent = `확인 필요 (${pending.length}건)`;

      const p = $('pendingList');
      p.textContent = '';
      if (pending.length === 0) p.appendChild(el('div', 'empty', { textContent: '확인할 신청이 없습니다.' }));
      pending.forEach((r) => renderRow(r, p));

      const c = $('confirmedList');
      c.textContent = '';
      if (confirmed.length === 0) c.appendChild(el('div', 'empty', { textContent: '확정된 예약이 없습니다.' }));
      confirmed.forEach((r) => renderRow(r, c));

      // 목록을 새로 받으면 보고 있던 탭도 갱신한다. 확정·취소 후에도
      // 달력과 검색 결과가 최신 상태를 보여준다.
      if (activeTab === 'calendar') renderCalendar();
      if (activeTab === 'history') renderHistory();
    })
    .catch((err) => {
      // 토큰이 만료되면 다시 로그인해야 한다.
      if (err.status === 401 || err.status === 403) { logout(); showLogin('다시 로그인해 주세요.'); return; }
      showToast(`목록을 불러오지 못했습니다: ${err.message}`);
    });
}

// ---- 달력 탭 ----

let calYear = 0;
let calMonth = 0;   // 0-11
let pickedDay = ''; // 'YYYY-MM-DD'

function monthPrefix() {
  return `${calYear}-${String(calMonth + 1).padStart(2, '0')}-`;
}

function renderCalendar() {
  // 처음 열 때는 이번 달부터 본다.
  if (!calYear) {
    const t = new Date();
    calYear = t.getFullYear();
    calMonth = t.getMonth();
  }

  const grid = $('calGrid');
  $('calLabel').textContent = `${calYear}년 ${calMonth + 1}월`;
  grid.textContent = '';

  const cells = monthGrid(allRows, calYear, calMonth);
  const firstWeekday = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date();

  for (let i = 0; i < firstWeekday; i++) grid.appendChild(el('span', 'cal-blank'));

  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${monthPrefix()}${String(d).padStart(2, '0')}`;
    const dow = new Date(calYear, calMonth, d).getDay();

    const btn = el('button', 'cal-day', { type: 'button' });
    if (dow === 0) btn.classList.add('sun');
    if (dow === 6) btn.classList.add('sat');
    if (today.getFullYear() === calYear && today.getMonth() === calMonth && today.getDate() === d) {
      btn.classList.add('today');
    }
    btn.dataset.key = key;
    if (key === pickedDay) btn.classList.add('picked');
    btn.appendChild(el('div', 'num', { textContent: String(d) }));

    for (const r of cells.get(key) || []) {
      btn.appendChild(el('div', `chip ${r.status}`, {
        textContent: `${houseLabel(r.house)} ${r.name}`,
        title: `${houseLabel(r.house)} ${r.name} (${r.unit_dong}동 ${r.unit_ho}호)`,
      }));
    }

    btn.addEventListener('click', () => showDay(key));
    grid.appendChild(btn);
  }

  // 달을 옮기면 선택을 놓는다. 다른 달의 상세가 남아 있으면 헷갈린다.
  if (pickedDay && pickedDay.startsWith(monthPrefix())) showDay(pickedDay);
  else { pickedDay = ''; $('dayCard').hidden = true; }
}

// 칸을 누르면 그날 예약을 아래에 펼친다. 확정·취소·신청서 출력이 거기서 된다.
function showDay(key) {
  pickedDay = key;
  const rows = monthGrid(allRows, calYear, calMonth).get(key) || [];
  const [, m, d] = key.split('-').map(Number);

  $('dayTitle').textContent = `${m}월 ${d}일 · ${rows.length}건`;
  const host = $('dayList');
  host.textContent = '';
  if (rows.length === 0) host.appendChild(el('div', 'empty', { textContent: '이 날은 예약이 없습니다.' }));
  rows.forEach((r) => renderRow(r, host));
  $('dayCard').hidden = false;

  // 칸을 data-key로 직접 찾는다. 인덱스로 세면 앞의 빈칸 개수에 의존해 취약하다.
  document.querySelectorAll('.cal-day').forEach((b) => b.classList.toggle('picked', b.dataset.key === key));
}

$('calPrev').addEventListener('click', () => {
  calMonth -= 1;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }
  renderCalendar();
});
$('calNext').addEventListener('click', () => {
  calMonth += 1;
  if (calMonth > 11) { calMonth = 0; calYear += 1; }
  renderCalendar();
});

// ---- 지난 예약 탭 ----

// 마지막 검색. 목록을 새로 받으면 같은 결과를 다시 그린다 — 확정·취소 후에도
// 보던 결과가 유지된다.
let lastSearch = null;

function renderHistory() {
  if (!lastSearch) { $('resultCard').hidden = true; return; }
  if (lastSearch.kind === 'unit') searchUnit(lastSearch.dong, lastSearch.ho);
  else searchName(lastSearch.query);
}

function searchUnit(dong, ho) {
  if (!String(dong || '').trim() || !String(ho || '').trim()) {
    showToast('동과 호를 모두 입력해 주세요.');
    return;
  }
  lastSearch = { kind: 'unit', dong, ho };
  const rows = findByHousehold(allRows, dong, ho);
  const sum = summarize(rows, HISTORY_MONTHS);
  showResult(
    `${String(dong).trim()}동 ${String(ho).trim()}호 · 총 ${rows.length}건`
      + ` (최근 ${HISTORY_MONTHS}개월 ${sum.count}회 · ${sum.nights}박)`,
    rows
  );
}

function searchName(query) {
  const q = String(query || '').trim();
  // findByName이 빈 검색어를 빈 결과로 막지만, 왜 안 나오는지는 알려야 한다.
  if (!q) { showToast('이름을 입력해 주세요.'); return; }
  lastSearch = { kind: 'name', query: q };
  const rows = findByName(allRows, q);
  showResult(`'${q}' · ${rows.length}건`, rows);
}

const STATUS_LABEL = { pending: '확인 필요', confirmed: '확정', cancelled: '취소됨' };

function showResult(title, rows) {
  $('resultTitle').textContent = title;
  const host = $('resultList');
  host.textContent = '';

  if (rows.length === 0) {
    host.appendChild(el('div', 'empty', { textContent: '찾은 예약이 없습니다.' }));
  }

  for (const r of rows) {
    const line = el('div', `hist-row${r.status === 'cancelled' ? ' cancelled' : ''}`);
    line.appendChild(el('div', 'hist-when when', {
      textContent: `${r.check_in} ~ ${r.check_out} · ${r.name} (${r.unit_dong}동 ${r.unit_ho}호)`,
    }));
    line.appendChild(el('div', 'hist-what', {
      textContent: `${houseLabel(r.house)} · ${countNights(r.check_in, r.check_out)}박`
        + ` · ${STATUS_LABEL[r.status] || r.status}`,
    }));
    host.appendChild(line);
  }
  $('resultCard').hidden = false;
}

$('searchUnitBtn').addEventListener('click', () => searchUnit($('qDong').value, $('qHo').value));
$('searchNameBtn').addEventListener('click', () => searchName($('qName').value));
$('qHo').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('searchUnitBtn').click(); });
$('qName').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('searchNameBtn').click(); });

// ---- 신청서 출력 ----
// 좌표는 config.fields[].rect에서 나오므로 index.html과 같은 자리에 찍힌다.

const sheetCanvas = $('sheetCanvas');
const sheetCtx = sheetCanvas.getContext('2d');
let formImage = null;
let currentRow = null;

function loadFormImage() {
  if (formImage) return Promise.resolve(formImage);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { formImage = img; resolve(img); };
    img.onerror = () => reject(new Error('서식 이미지를 불러오지 못했습니다.'));
    img.src = config.form.image;
  });
}

// 예약 한 건을 서식 칸에 들어갈 문자열로 바꾼다.
function sheetValues(row) {
  const nights = countNights(row.check_in, row.check_out);
  const today = new Date();
  const applyDate = `${today.getFullYear()}.${today.getMonth() + 1}.${today.getDate()}`;

  const out = {};
  for (const field of printedCells(config)) {
    switch (field.id) {
      case 'applyDate': out[field.id] = applyDate; break;
      case 'name': out[field.id] = row.name; break;
      case 'unit': out[field.id] = `${row.unit_dong}동 ${row.unit_ho}호`; break;
      case 'phone': out[field.id] = row.phone; break;
      case 'period': out[field.id] = shortDate(row.check_in, row.check_out); break;
      case 'nights': out[field.id] = nights ? `${nights}일` : ''; break;
      case 'amount': out[field.id] = `${row.amount.toLocaleString('ko-KR')}원`; break;
      case 'people': out[field.id] = `${row.people}명`; break;
      // 은행입금일은 입금 확인 후 관리사무소가 손으로 적는다.
      default: out[field.id] = '';
    }
  }
  return out;
}

function drawSheet(row) {
  const { width, height } = config.form;
  sheetCanvas.width = width;
  sheetCanvas.height = height;

  sheetCtx.clearRect(0, 0, width, height);
  sheetCtx.drawImage(formImage, 0, 0, width, height);
  sheetCtx.fillStyle = '#000';
  sheetCtx.textAlign = 'center';
  sheetCtx.textBaseline = 'middle';

  const text = sheetValues(row);
  for (const field of printedCells(config)) {
    const value = text[field.id];
    if (!value) continue;
    const pos = rectToPoint(field.rect);

    // 칸을 넘치면 들어갈 때까지 폰트를 줄인다.
    let size = 14;
    const font = (s) => `${s}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
    sheetCtx.font = font(size);
    while (sheetCtx.measureText(value).width > pos.maxWidth && size > 8) {
      size -= 1;
      sheetCtx.font = font(size);
    }
    sheetCtx.fillText(value, pos.x, pos.y);
  }
}

function openSheet(row) {
  loadFormImage()
    .then(() => {
      currentRow = row;
      drawSheet(row);
      $('sheetOverlay').hidden = false;
    })
    .catch((err) => showToast(err.message));
}

function closeSheet() { $('sheetOverlay').hidden = true; }

$('sheetBackdrop').addEventListener('click', closeSheet);
$('sheetClose').addEventListener('click', closeSheet);
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !$('sheetOverlay').hidden) closeSheet();
});

$('sheetSave').addEventListener('click', () => {
  if (!currentRow) return;
  const stamp = currentRow.check_in.replace(/-/g, '');
  const name = `게스트하우스신청서_${currentRow.unit_dong}동${currentRow.unit_ho}호_${stamp}.jpg`;

  sheetCanvas.toBlob((blob) => {
    if (!blob) { showToast('이미지를 만들지 못했습니다.'); return; }
    const file = new File([blob], name, { type: 'image/jpeg' });

    // 폰에서는 <a download>로 사진함에 저장되지 않는다. 공유 시트를 연다.
    // canShare만 보면 Windows의 Chrome·Edge도 참이라 PC가 이 분기를 타 버린다.
    // 그러면 신청서를 파일로 받을 방법이 사라진다 — 이 화면에서는 치명적이다.
    if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: '게스트하우스 신청서' }).catch((err) => {
        if (err && err.name === 'AbortError') return;
        showToast('저장하지 못했습니다. 다시 시도해 주세요.');
      });
      return;
    }
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    a.click();
    // 클릭 직후 해제하면 일부 브라우저가 비동기 다운로드 중에 실패한다.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('저장했습니다.');
  }, 'image/jpeg', 0.92);
});

// ---- 부팅 ----

loadConfig().then((loaded) => {
  config = loaded;

  if (!config.reservation.enabled) {
    $('offText').innerHTML =
      '예약 기능이 꺼져 있습니다.<br>관리자 설정 화면에서 켜 주세요.';
    $('offCard').hidden = false;
    return;
  }

  if (accessToken) showList(); else showLogin('');
});
</script>
