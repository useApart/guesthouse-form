<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>게스트하우스 신청서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #F5F4F0; color: #1E251E; }
  .wrap { min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px 64px; }
  .inner { width: 100%; max-width: 560px; }
  .eyebrow { text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: #7A8177; margin-bottom: 6px; }
  h1 { text-align: center; margin: 0 0 24px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .tabs { display: flex; background: #EAE8E1; border-radius: 14px; padding: 4px; margin-bottom: 20px; gap: 4px; }
  .tab { flex: 1; height: 44px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; background: transparent; color: #7A8177; }
  .tab.active { background: #fff; color: #1F6D57; box-shadow: 0 1px 2px rgba(30,37,30,.08); }
  .card { background: #fff; border-radius: 20px; border: 1px solid #E8E6DE; box-shadow: 0 1px 3px rgba(30,37,30,.04); padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; }
  form { display: flex; flex-direction: column; gap: 18px; }
  label { font-size: 14px; font-weight: 600; color: #3C443B; display: block; margin-bottom: 6px; }
  .field { display: flex; flex-direction: column; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  input[type="text"], input[type="tel"], input[type="date"] {
    height: 50px; width: 100%; border-radius: 12px; border: 1px solid #DDDBD2; padding: 0 14px;
    font-size: 16px; font-family: inherit; color: #1E251E; background: #fff;
  }
  input[type="date"] { background: #FBFAF7; }
  input.date-in[readonly] { cursor: pointer; background: #FBFAF7; }

  .cal-pop {
    position: fixed; z-index: 1000; width: 296px; max-width: calc(100vw - 16px);
    background: #fff; border: 1px solid #E8E6DE; border-radius: 14px;
    box-shadow: 0 8px 24px rgba(30,37,30,.18); padding: 12px; display: none;
  }
  .cal-pop.show { display: block; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-nav { width: 38px; height: 38px; border: none; background: #F5F4F0; border-radius: 10px; font-size: 18px; font-weight: 700; color: #3C443B; cursor: pointer; font-family: inherit; }
  .cal-nav:hover { background: #EAE8E1; }
  .cal-label { font-size: 15px; font-weight: 700; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: #7A8177; margin-bottom: 4px; }
  .cal-week span:first-child { color: #C0392B; }
  .cal-week span:last-child { color: #2E5AA8; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-blank { height: 38px; }
  .cal-day { height: 38px; border: none; background: none; border-radius: 10px; font-size: 14px; font-family: inherit; color: #1E251E; cursor: pointer; }
  .cal-day:hover { background: #F5F4F0; }
  .cal-day.cal-sun { color: #C0392B; }
  .cal-day.cal-sat { color: #2E5AA8; }
  .cal-day.cal-today { font-weight: 700; box-shadow: inset 0 0 0 1.5px #1F6D57; }
  .cal-day.cal-selected { background: #1F6D57; color: #fff; }
  .cal-foot { display: flex; gap: 8px; margin-top: 8px; }
  .cal-action { flex: 1; height: 38px; border-radius: 10px; border: 1px solid #DDDBD2; background: #fff; font-size: 13px; font-weight: 600; color: #3C443B; cursor: pointer; font-family: inherit; }
  .cal-action:hover { background: #F5F4F0; }
  .amount-wrap { position: relative; }
  .amount-wrap span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #7A8177; }
  .amount-wrap input { padding-right: 40px; }
  .link-btn {
    align-self: flex-start; background: none; border: none; padding: 4px 0; margin-top: -8px;
    font-size: 12px; color: #7A8177; text-decoration: underline; cursor: pointer; font-family: inherit;
  }
  .guest-row { display: flex; gap: 8px; }
  .guest-btn { flex: 1; height: 46px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; border: 1px solid #DDDBD2; background: #fff; color: #3C443B; }
  .guest-btn.active { border: 1.5px solid #1F6D57; background: #EAF3EF; color: #1F6D57; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 12px; background: #F5F4F0; border: 1px solid #E8E6DE; cursor: pointer; }
  .toggle-row.on { background: #EAF3EF; border-color: #1F6D57; }
  .toggle-title { font-size: 15px; font-weight: 600; margin-bottom: 0; }
  .toggle-sub { font-size: 13px; color: #7A8177; margin-top: 2px; }
  .switch { width: 44px; height: 26px; border-radius: 13px; background: #D8D6CD; position: relative; flex-shrink: 0; transition: background .15s; }
  .switch.on { background: #1F6D57; }
  .switch .thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: 3px; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch.on .thumb { left: 21px; }
  .summary { margin: 0; font-size: 13px; color: #7A8177; }
  .warning { margin: 0; font-size: 13px; color: #C0392B; font-weight: 700; }
  #canvas {
    width: 100%; height: auto; display: block; border: 1px solid #E8E6DE; border-radius: 16px;
    background: #fff;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .btn { flex: 1; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; border: none; }
  .btn-primary { background: #1F6D57; color: #fff; }
  .btn-primary:hover { background: #195C49; }
  .btn-secondary { background: #fff; color: #3C443B; border: 1px solid #D8D6CD; }
  .btn-secondary:hover { background: #F5F4F0; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-secondary:disabled:hover { background: #fff; }
  .btn-primary:disabled:hover { background: #1F6D57; }
  .status-msg { margin: -8px 0 0; font-size: 13px; color: #7A8177; min-height: 1.2em; }
  .account { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 12px; padding: 16px; border-radius: 12px; background: #F5F4F0; margin-top: 6px; }
  .account .acc-info { min-width: 0; flex: 1 1 200px; }
  .account .num { font-size: 15px; font-weight: 700; word-break: break-word; }
  .account .name { font-size: 13px; color: #7A8177; margin-top: 2px; }
  .copy-btn { flex-shrink: 0; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #D8D6CD; background: #fff; color: #3C443B; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .clear-link { background: none; border: none; color: #9A9F92; font-size: 13px; cursor: pointer; text-decoration: underline; font-family: inherit; padding: 4px 2px; }
  .top-actions { display: flex; justify-content: flex-end; margin: -12px 0 14px; }
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: #1E251E; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <div class="eyebrow" id="siteOrg">원흥LH13단지주거복지지원센터</div>
    <h1 id="siteTitle">게스트하우스 신청서</h1>

    <div class="tabs">
      <button class="tab active" type="button">타이핑으로 작성</button>
      <a href="draw.html" style="text-decoration:none; flex:1;">
        <button class="tab" type="button" style="width:100%;">손으로 직접 쓰기</button>
      </a>
    </div>

    <div class="top-actions">
      <button type="button" class="clear-link" id="clearSaved">저장정보 초기화</button>
    </div>

    <div class="card">
      <!-- 입력칸은 config.fields에서 생성된다. buildForm() 참조. -->
      <form id="form" autocomplete="on"></form>

      <p id="summary" class="summary"></p>
      <p id="warning" class="warning" hidden></p>

      <canvas id="canvas" width="707" height="1000"></canvas>

      <div class="btn-row">
        <button type="button" id="share" class="btn btn-primary" disabled>이미지 만들어 보내기</button>
        <button type="button" id="download" class="btn btn-secondary" disabled>이미지 저장</button>
      </div>
      <p id="status" class="status-msg"></p>

      <div class="account">
        <div class="acc-info">
          <div class="num" id="accountNumber">국민 856901-00-129046</div>
          <div class="name" id="accountHolder">원흥LH13단지주거복지지원센터</div>
        </div>
        <button type="button" class="copy-btn" id="copyAccount">계좌번호 복사</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { countNights, calcAmount } from './calc.js';
import {
  DEFAULT_CONFIG, clone, loadConfig, normalizeConfig,
  formFields, printedCells, packRows, rectToPoint,
} from './config.js';

const $ = (id) => document.getElementById(id);

const canvas = $('canvas');
const ctx = canvas.getContext('2d');

// 설정을 읽기 전에도 화면이 동작해야 하므로 내장 기본값에서 시작한다.
let config = clone(DEFAULT_CONFIG);

// 설정에서 유도되는 값들. boot()에서 buildDerived()가 채운다.
let POS = {};          // 서식에 찍을 칸의 중심 좌표
let REQUIRED = {};     // id -> 라벨. 비어 있으면 내보내기 버튼을 잠근다
let SAVED_FIELDS = []; // localStorage에 기억할 항목
let CLEARABLE = new Set();
let DATE_FIELDS = [];
let ACCOUNT_TEXT = '';

function buildDerived() {
  POS = {};
  for (const field of printedCells(config)) POS[field.id] = rectToPoint(field.rect);

  REQUIRED = {};
  for (const field of formFields(config)) if (field.required) REQUIRED[field.id] = field.label;

  SAVED_FIELDS = formFields(config).filter((f) => f.remember).map((f) => f.id);
  CLEARABLE = new Set(formFields(config).filter((f) => f.clearable).map((f) => f.id));
  DATE_FIELDS = formFields(config).filter((f) => f.input === 'date').map((f) => f.id);

  // 토스·카카오페이 등의 '붙여넣기'가 은행과 계좌번호를 함께 인식하도록 은행명을 붙인다.
  ACCOUNT_TEXT = `${config.account.bank} ${config.account.number}`;
}

// ---- 폼 생성 ----
// 마크업은 리팩터 전 손으로 쓰던 것과 클래스까지 동일하다. CSS를 건드리지 않기 위함이다.

function el(tag, className, props) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  Object.assign(node, props || {});
  return node;
}

function buildInput(field) {
  const wrap = el('div', 'field');
  wrap.appendChild(el('label', null, { htmlFor: field.id, textContent: field.label }));

  if (field.input === 'date') {
    wrap.appendChild(el('input', 'date-in', {
      type: 'text', id: field.id, readOnly: true, placeholder: '날짜 선택',
    }));
  } else if (field.input === 'text' || field.input === 'phone') {
    wrap.appendChild(el('input', null, {
      type: field.input === 'phone' ? 'tel' : 'text',
      id: field.id,
      placeholder: field.placeholder || '',
      maxLength: field.maxlength || 20,
    }));
  } else if (field.input === 'choice') {
    const row = el('div', 'guest-row', { id: 'guestRow' });
    config.pricing.peopleOptions.forEach((n, i) => {
      const btn = el('button', `guest-btn${i === 0 ? ' active' : ''}`, {
        type: 'button', textContent: `${n}명`,
      });
      btn.dataset.n = String(n);
      row.appendChild(btn);
    });
    wrap.appendChild(row);
    wrap.appendChild(el('input', null, {
      type: 'hidden', id: field.id, value: String(config.pricing.peopleOptions[0]),
    }));
  } else if (field.input === 'money') {
    const money = el('div', 'amount-wrap');
    money.appendChild(el('input', null, {
      type: 'text', id: field.id, inputMode: 'numeric', placeholder: '자동 계산',
    }));
    money.appendChild(el('span', null, { textContent: '원' }));
    wrap.appendChild(money);
  }
  return wrap;
}

// 공휴일 토글은 label 자체가 행이라 .field로 감싸지 않는다(현재 마크업과 동일).
function buildToggle(field) {
  const row = el('label', 'toggle-row', { id: 'holidayRow', htmlFor: field.id });
  row.appendChild(el('input', 'visually-hidden', { type: 'checkbox', id: field.id }));

  const text = el('div');
  text.appendChild(el('div', 'toggle-title', { textContent: field.label }));
  // 문구를 저장하지 않고 요금에서 만든다. 주말 요금을 올리면 설명도 같이 바뀐다.
  text.appendChild(el('div', 'toggle-sub', {
    textContent: `전 기간 ${config.pricing.weekend.toLocaleString('ko-KR')}원`,
  }));
  row.appendChild(text);

  const sw = el('div', 'switch', { id: 'holidaySwitch' });
  sw.appendChild(el('div', 'thumb'));
  row.appendChild(sw);
  return row;
}

function buildForm() {
  const form = $('form');
  form.textContent = '';
  for (const row of packRows(formFields(config))) {
    const nodes = row.map((f) => (f.input === 'toggle' ? buildToggle(f) : buildInput(f)));
    if (row.length === 2) {
      const grid = el('div', 'row2');
      nodes.forEach((n) => grid.appendChild(n));
      form.appendChild(grid);
    } else {
      form.appendChild(nodes[0]);
    }
    // 금액 칸 바로 뒤에 "자동 계산으로 되돌리기" 버튼을 둔다.
    if (row.length === 1 && row[0].input === 'money') {
      form.appendChild(el('button', 'link-btn', {
        type: 'button', id: 'resetAmount', hidden: true, textContent: '자동 계산으로 되돌리기',
      }));
    }
  }
}

function applySiteTexts() {
  $('siteOrg').textContent = config.site.org;
  $('siteTitle').textContent = config.site.title;
  document.title = config.site.title;
  $('accountNumber').textContent = `${config.account.bank} ${config.account.number}`;
  $('accountHolder').textContent = config.account.holder;
}

// ---- 서식 이미지와 캔버스 ----

// 'loading' | 'ready' | 'error'. 이미지가 준비되지 않은 동안은 버튼을 잠그고 캔버스에 아무것도 그리지 않는다.
let imageState = 'loading';

const formImage = new Image();
const imageReady = new Promise((resolve, reject) => {
  formImage.onload = () => { imageState = 'ready'; resolve(); };
  formImage.onerror = () => {
    imageState = 'error';
    reject(new Error('서식 이미지를 불러오지 못했습니다.'));
  };
});

function drawForm(text) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 준비 전/실패 시에는 그리지 않고 멈춘다. 이 상태에서 내보내기가 아예 불가능하도록
  // 만드는 것은 syncButtons()의 버튼 잠금이며, 여기서는 오래된 내용만 지운다.
  if (imageState !== 'ready') return;
  try {
    ctx.drawImage(formImage, 0, 0, canvas.width, canvas.height);
  } catch {
    // drawImage가 InvalidStateError를 던지는 경우(이미지가 깨진 상태). render()가 여기서 멈추지 않도록 흡수한다.
    imageState = 'error';
    return;
  }
  ctx.fillStyle = '#000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const [key, pos] of Object.entries(POS)) {
    const value = text[key];
    if (!value) continue;

    // 칸을 넘치면 들어갈 때까지 폰트를 줄인다.
    let size = 14;
    ctx.font = `${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
    while (ctx.measureText(value).width > pos.maxWidth && size > 8) {
      size -= 1;
      ctx.font = `${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
    }
    ctx.fillText(value, pos.x, pos.y);
  }
}

// ---- 값 읽기와 서식용 문자열 만들기 ----

function readValues() {
  const values = {};
  for (const field of formFields(config)) {
    const node = $(field.id);
    if (!node) continue;
    if (field.input === 'toggle') {
      values[field.id] = node.checked;
    } else if (field.input === 'choice') {
      values[field.id] = Number(node.value);
    } else if (field.input === 'money') {
      values[field.id] = Number(node.value.replace(/[^0-9]/g, ''));
      values.amountEntered = /[0-9]/.test(node.value);
    } else {
      values[field.id] = node.value.trim();
    }
  }
  return values;
}

// 입실일·퇴실일로 사용기간 문자열을 만든다. 칸이 136px로 좁아 'YYYY-MM-DD ~ YYYY-MM-DD'를
// 그대로 넣으면 폰트가 심하게 줄어든다. 그래서 연도는 앞에 한 번만 쓰고 월·일의 앞자리 0은
// 뗀다. 연도가 바뀌는 경우(예: 12월→1월)에만 뒤쪽 날짜에도 연도를 붙인다.
function shortDate(checkIn, checkOut) {
  if (!checkIn || !checkOut) return '';
  const [y1, m1, d1] = checkIn.split('-').map(Number);
  const [y2, m2, d2] = checkOut.split('-').map(Number);
  const end = y1 === y2 ? `${m2}.${d2}` : `${y2}.${m2}.${d2}`;
  return `${y1}.${m1}.${d1} ~ ${end}`;
}

// 'YYYY-MM-DD' -> 'YYYY.M.D'. 은행입금일 칸(136px)도 사용기간과 같은 이유로 앞자리 0을 뗀다.
function compactDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  return `${y}.${m}.${d}`;
}

function formatValues(v, nights) {
  const out = {};
  for (const field of printedCells(config)) {
    const id = field.id;
    if (id === 'period') {
      out.period = v.checkIn && v.checkOut ? shortDate(v.checkIn, v.checkOut) : '';
    } else if (id === 'nights') {
      out.nights = nights ? `${nights}일` : '';
    } else if (field.input === 'money') {
      out[id] = v.amountEntered ? `${v[id].toLocaleString('ko-KR')}원` : '';
    } else if (field.input === 'choice') {
      out[id] = v[id] ? `${v[id]}명` : '';
    } else if (field.input === 'date') {
      out[id] = v[id] ? compactDate(v[id]) : '';
    } else {
      out[id] = v[id] || '';
    }
  }
  return out;
}

// ---- 렌더링 ----

// 사용자가 금액을 직접 고쳤는지 추적한다. 고쳤다면 자동 계산으로 덮어쓰지 않는다.
let amountEdited = false;
// 사용자가 금액 칸에 포커스를 두고 있는 동안은 절대 값을 다시 쓰지 않는다(캐럿 점프·자리수 밀림 방지).
let amountFocused = false;

function render() {
  const v = readValues();
  const nights = countNights(v.checkIn, v.checkOut);

  if (!amountEdited && !amountFocused && $('amount')) {
    const auto = calcAmount(v, config.pricing);
    $('amount').value = auto ? auto.toLocaleString('ko-KR') : '';
    v.amount = auto;
    v.amountEntered = auto > 0;
  }
  if ($('resetAmount')) $('resetAmount').hidden = !amountEdited;

  $('summary').textContent = nights
    ? `${nights}일 ${v.people}명 · ${amountEdited ? '직접 입력' : '자동 계산'} ${v.amount.toLocaleString('ko-KR')}원`
    // 날짜가 둘 다 채워졌는데 0박이면 역전 상태다. 그 안내는 #status가 맡으므로 여기선 비운다.
    : (v.checkIn && v.checkOut ? '' : '입실일과 퇴실일을 선택하세요.');

  const warn = $('warning');
  // 퇴실일<=입실일 상태의 안내는 #status(syncButtons)에서만 표시한다 — 여기서 같은 문장을 또 띄우지 않는다.
  // 버튼은 그와 무관하게 syncButtons()가 계속 잠근다.
  if (v.checkIn && v.checkOut && nights === 0) {
    warn.hidden = true;
  } else if (nights >= config.pricing.maxNights) {
    warn.textContent = config.pricing.maxNightsText;
    warn.hidden = false;
  } else {
    warn.hidden = true;
  }

  drawForm(formatValues(v, nights));
  syncButtons();
}

function missingFields(v) {
  return Object.entries(REQUIRED).filter(([k]) => !v[k]).map(([, label]) => label);
}

function toJpegFile() {
  const v = readValues();
  const stamp = (v.applyDate || '').replace(/-/g, ''); // 신청일은 필수값이라 버튼이 활성화된 시점엔 항상 있다.
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      (blob) => {
        if (!blob) return reject(new Error('이미지 생성에 실패했습니다.'));
        resolve(new File([blob], `게스트하우스신청서_${stamp}.jpg`, { type: 'image/jpeg' }));
      },
      'image/jpeg',
      0.92
    );
  });
}

// #status는 "계속 화면에 남아 있어야 하는" 검증/게이팅 안내 전용이다(입력 누락, 날짜 역전,
// 서식 이미지 로딩/실패, 5박 이상 경고 등). syncButtons()에서만 값을 채운다.
function setStatus(msg) { $('status').textContent = msg; }

// 저장했습니다/복사됨/공유 관련 안내처럼 순간적으로 보여주면 되는 메시지는 토스트로 띄운다.
let toastTimer;
function showToast(msg) {
  const toast = $('toast');
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

// 필수값이 비거나 숙박일수가 0이거나 서식 이미지가 준비되지 않았으면 버튼을 잠근다.
// render()의 마지막 줄뿐 아니라 이미지 로딩 완료/실패 시에도 별도로 호출된다.
function syncButtons() {
  const v = readValues();
  const missing = missingFields(v);
  const invalidStay = v.checkIn && v.checkOut && countNights(v.checkIn, v.checkOut) === 0;
  const blocked = imageState !== 'ready' || missing.length > 0 || invalidStay;
  $('share').disabled = blocked;
  $('download').disabled = blocked;
  if (imageState === 'error') {
    setStatus('서식 이미지를 불러오지 못했습니다. 새로고침해 주세요.');
  } else if (missing.length > 0) {
    setStatus(`입력이 필요합니다: ${missing.join(', ')}`);
  } else if (invalidStay) {
    setStatus('퇴실일은 입실일보다 뒤여야 합니다.');
  } else if (imageState === 'loading') {
    setStatus('서식 이미지를 불러오는 중입니다...');
  } else {
    setStatus('');
  }
}

// ---- 내보내기 ----

$('share').addEventListener('click', async () => {
  try {
    const file = await toJpegFile();
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: config.site.title });
      return;
    }
    showToast('이 브라우저는 공유를 지원하지 않습니다. "이미지 저장"을 눌러 주세요.');
  } catch (err) {
    // 사용자가 공유 시트를 닫은 경우는 오류가 아니다.
    if (err.name === 'AbortError') { return; }
    // iOS 사파리 등에서 사용자 제스처 타이밍 문제로 공유가 실패하는 사례가 흔하다.
    // 영어 브라우저 오류 대신 대안 행동을 안내한다.
    showToast('공유하지 못했습니다. "이미지 저장"을 눌러 저장한 뒤 문자메시지에 직접 첨부해 주세요.');
  }
});

$('download').addEventListener('click', async () => {
  try {
    const file = await toJpegFile();
    // 폰(iOS/안드로이드)에서는 <a download>로는 사진함에 저장되지 않는다.
    // 공유 시트를 열면 사용자가 '이미지 저장'을 눌러 사진함에 바로 저장할 수 있다.
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: config.site.title });
      return;
    }
    // 공유 파일이 지원되지 않는 환경(주로 PC)에서는 파일로 내려받는다.
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    a.click();
    // 클릭 직후 바로 해제하면 일부 브라우저(특히 데스크톱 사파리)는 비동기로 다운로드를
    // 시작하다가 이미 해제된 URL을 만나 실패한다. 클릭 처리가 끝난 뒤에 해제한다.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('저장했습니다.');
  } catch (err) {
    if (err.name === 'AbortError') { return; }
    showToast(`이미지를 만들지 못했습니다: ${err.message}`);
  }
});

// ---- 날짜 팝오버 ----
// 날짜는 년-월-일 순서를 기기 설정과 무관하게 고정하기 위해 직접 입력 대신 커스텀 달력
// 팝오버로 받는다. 모든 날짜 칸이 팝오버 하나를 공유한다.

const calPop = document.createElement('div');
calPop.className = 'cal-pop';
calPop.innerHTML = `
  <div class="cal-head">
    <button type="button" class="cal-nav" id="calPrev" aria-label="이전 달">‹</button>
    <div class="cal-label" id="calLabel"></div>
    <button type="button" class="cal-nav" id="calNext" aria-label="다음 달">›</button>
  </div>
  <div class="cal-week">
    <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
  </div>
  <div class="cal-grid" id="calGrid"></div>
  <div class="cal-foot">
    <button type="button" class="cal-action" id="calToday">오늘</button>
    <button type="button" class="cal-action" id="calClear">지우기</button>
  </div>
`;
document.body.appendChild(calPop);

const calLabel = calPop.querySelector('#calLabel');
const calGrid = calPop.querySelector('#calGrid');
const calClearBtn = calPop.querySelector('#calClear');

let calTarget = null; // 현재 팝오버가 붙어 있는 input 엘리먼트
let calYear = 0;
let calMonth = 0; // 0-11

function pad2(n) { return String(n).padStart(2, '0'); }
// toISOString()은 로컬 타임존에 따라 날짜가 하루 밀릴 수 있어 쓰지 않는다.
// year/month/day를 그대로 문자열로 조립한다.
function toDateStr(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }

function parseDateStr(s) {
  if (!s) return null;
  const [y, m, d] = s.split('-').map(Number);
  if (!y || !m || !d) return null;
  return { y, m: m - 1, d };
}

function renderCalendarGrid() {
  calLabel.textContent = `${calYear}년 ${calMonth + 1}월`;
  const selected = parseDateStr(calTarget ? calTarget.value : '');
  const firstWeekday = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date();

  calGrid.innerHTML = '';
  for (let i = 0; i < firstWeekday; i++) {
    const blank = document.createElement('span');
    blank.className = 'cal-blank';
    calGrid.appendChild(blank);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cal-day';
    btn.textContent = String(d);
    const dow = new Date(calYear, calMonth, d).getDay();
    if (dow === 0) btn.classList.add('cal-sun');
    if (dow === 6) btn.classList.add('cal-sat');
    if (selected && selected.y === calYear && selected.m === calMonth && selected.d === d) {
      btn.classList.add('cal-selected');
    }
    if (today.getFullYear() === calYear && today.getMonth() === calMonth && today.getDate() === d) {
      btn.classList.add('cal-today');
    }
    btn.addEventListener('click', () => selectDate(d));
    calGrid.appendChild(btn);
  }
}

function selectDate(d) {
  if (!calTarget) return;
  calTarget.value = toDateStr(calYear, calMonth, d);
  closeCalendar();
  render();
}

// 카드 밖으로 잘리지 않도록 body에 붙여 놓은 팝오버를 탭한 칸의 위치에 맞춰 옮긴다.
// 화면 아래로 넘치면 칸 위쪽에, 오른쪽으로 넘치면 왼쪽으로 당겨 360px 폭 화면에서도 맞춘다.
function positionCalendar() {
  if (!calTarget) return;
  const rect = calTarget.getBoundingClientRect();
  const popW = calPop.offsetWidth || 296;
  const popH = calPop.offsetHeight || 340;
  const margin = 8;
  let left = Math.min(rect.left, window.innerWidth - popW - margin);
  left = Math.max(left, margin);
  let top = rect.bottom + 6;
  if (top + popH > window.innerHeight - margin) {
    top = rect.top - popH - 6;
  }
  top = Math.max(top, margin);
  calPop.style.left = `${left}px`;
  calPop.style.top = `${top}px`;
}

function openCalendar(input) {
  calTarget = input;
  const parsed = parseDateStr(input.value) || (() => {
    const t = new Date();
    return { y: t.getFullYear(), m: t.getMonth(), d: t.getDate() };
  })();
  calYear = parsed.y;
  calMonth = parsed.m;
  calClearBtn.hidden = !CLEARABLE.has(input.id);
  renderCalendarGrid();
  calPop.classList.add('show');
  positionCalendar();
}

function closeCalendar() {
  calPop.classList.remove('show');
  calTarget = null;
}

calPop.querySelector('#calPrev').addEventListener('click', () => {
  calMonth -= 1;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }
  renderCalendarGrid();
  positionCalendar();
});
calPop.querySelector('#calNext').addEventListener('click', () => {
  calMonth += 1;
  if (calMonth > 11) { calMonth = 0; calYear += 1; }
  renderCalendarGrid();
  positionCalendar();
});
calPop.querySelector('#calToday').addEventListener('click', () => {
  const t = new Date();
  calYear = t.getFullYear();
  calMonth = t.getMonth();
  selectDate(t.getDate());
});
calClearBtn.addEventListener('click', () => {
  if (!calTarget) return;
  calTarget.value = '';
  closeCalendar();
  render();
});

document.addEventListener('mousedown', (e) => {
  if (!calPop.classList.contains('show')) return;
  if (calPop.contains(e.target) || e.target === calTarget) return;
  closeCalendar();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && calPop.classList.contains('show')) closeCalendar();
});
window.addEventListener('resize', () => {
  if (calPop.classList.contains('show')) positionCalendar();
});

// ---- 입력 보조 ----

// 연락처를 입력하는 대로 하이픈을 자동으로 넣는다. 숫자만 남긴 뒤 지역/앞자리·중간·끝4자리로 끊는다.
function formatPhone(value) {
  const digits = value.replace(/\D/g, '').slice(0, 11);
  if (digits.length < 4) return digits;
  const a = digits.startsWith('02') ? 2 : 3; // 서울(02)만 지역번호 2자리, 그 외는 3자리
  const rest = digits.slice(a);
  if (rest.length <= 4) return `${digits.slice(0, a)}-${rest}`;
  return `${digits.slice(0, a)}-${rest.slice(0, -4)}-${rest.slice(-4)}`;
}

// 폼이 동적으로 생성되므로 리스너는 반드시 buildForm() 이후에 붙인다.
function attachFieldListeners() {
  for (const field of formFields(config)) {
    const node = $(field.id);
    if (!node) continue;

    if (field.input === 'date') {
      node.addEventListener('click', () => openCalendar(node));
      node.addEventListener('focus', () => openCalendar(node));
    } else if (field.input === 'phone') {
      node.addEventListener('input', (e) => {
        const formatted = formatPhone(e.target.value);
        if (formatted !== e.target.value) e.target.value = formatted;
      });
    } else if (field.input === 'money') {
      node.addEventListener('input', () => {
        // 숫자를 모두 지워 빈 값으로 돌아가면 자동 계산 모드로 복귀한다.
        // render()는 여기서 부르지 않는다 — #form의 버블링 input 리스너가 한 번만 호출한다.
        amountEdited = /[0-9]/.test(node.value);
      });
      node.addEventListener('focus', () => { amountFocused = true; });
      node.addEventListener('blur', () => {
        amountFocused = false;
        render(); // 자리를 떠났고 필드를 비웠다면 즉시 자동 계산으로 복귀시킨다.
      });
    } else if (field.input === 'toggle') {
      // 실제 상태는 체크박스가 그대로 들고 있다. 여기서는 스위치 시각만 맞춘다.
      node.addEventListener('change', () => {
        const on = node.checked;
        $('holidayRow').classList.toggle('on', on);
        $('holidaySwitch').classList.toggle('on', on);
      });
    }

    if (field.remember) node.addEventListener('input', saveFields);
  }

  // 사용인원: 시각은 버튼들, 실제 값은 숨김 입력에 저장한다.
  const guestRow = $('guestRow');
  if (guestRow) {
    guestRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.guest-btn');
      if (!btn) return;
      $('people').value = btn.dataset.n;
      guestRow.querySelectorAll('.guest-btn').forEach((b) => b.classList.toggle('active', b === btn));
      render();
    });
  }

  const resetAmount = $('resetAmount');
  if (resetAmount) {
    resetAmount.addEventListener('click', () => {
      amountEdited = false;
      render();
    });
  }

  $('form').addEventListener('input', render);
  // select/checkbox의 input 이벤트가 일부 구형 WebKit/WebView에서 누락되는 경우를 대비한 보강.
  $('form').addEventListener('change', render);
}

// ---- 저장값 ----

const STORE_KEY = 'guesthouse-form';

function restoreSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    for (const id of SAVED_FIELDS) {
      if (saved[id] && $(id)) $(id).value = saved[id];
    }
  } catch {
    // 저장값이 깨졌으면 무시하고 빈 폼으로 시작한다.
  }
}

function saveFields() {
  const data = {};
  for (const id of SAVED_FIELDS) if ($(id)) data[id] = $(id).value;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch {
    // 사파리 프라이빗 모드 등 저장이 막힌 환경. 기능 자체는 계속 동작해야 한다.
  }
}

$('clearSaved').addEventListener('click', () => {
  try {
    localStorage.removeItem(STORE_KEY);
  } catch {
    // 저장이 막힌 환경이면 애초에 지울 것도 없다.
  }
  for (const id of SAVED_FIELDS) if ($(id)) $(id).value = '';
  render();
  showToast('저장된 값을 지웠습니다.');
});

// ---- 부팅 ----

function setTodayDefaults() {
  // (sv-SE 로케일은 YYYY-MM-DD 형식을 준다)
  const today = new Date().toLocaleDateString('sv-SE');
  for (const field of formFields(config)) {
    if (field.input === 'date' && field.defaultToday && $(field.id)) $(field.id).value = today;
  }
}

// 관리자 미리보기: admin.html이 sessionStorage에 넣어둔 편집 중인 설정을 우선 쓴다.
const PREVIEW_KEY = 'guesthouse-config-preview';
const isPreview = new URLSearchParams(location.search).has('preview');

function previewConfig() {
  if (!isPreview) return null;
  try {
    const raw = sessionStorage.getItem(PREVIEW_KEY);
    return raw ? normalizeConfig(JSON.parse(raw)) : null;
  } catch {
    return null;
  }
}

// 미리보기에서는 빈 폼 대신 예시 값을 채워 실제 생성될 이미지를 그대로 보여준다.
function fillPreviewSamples() {
  const samples = { text: '홍길동', phone: '010-1234-5678' };
  for (const field of formFields(config)) {
    const node = $(field.id);
    if (!node || node.value) continue;
    if (field.input === 'text') node.value = field.id === 'unit' ? '101동 1201호' : samples.text;
    else if (field.input === 'phone') node.value = samples.phone;
  }
  const today = new Date();
  const plus = new Date(today.getFullYear(), today.getMonth(), today.getDate() + 2);
  if ($('checkIn')) $('checkIn').value = today.toLocaleDateString('sv-SE');
  if ($('checkOut')) $('checkOut').value = plus.toLocaleDateString('sv-SE');
}

function boot(loaded) {
  config = loaded;
  buildDerived();
  buildForm();
  applySiteTexts();
  attachFieldListeners();

  canvas.width = config.form.width;
  canvas.height = config.form.height;

  // 오늘 기본값을 먼저 넣고 저장값을 나중에 덮어쓴다 — 기억해 둔 값이 항상 이긴다.
  setTodayDefaults();
  restoreSaved();
  if (isPreview) fillPreviewSamples();

  formImage.src = config.form.image;

  render(); // 이미지가 아직 로딩 중이어도 요약/경고 텍스트와 버튼 잠금 상태를 즉시 반영한다.
  imageReady.then(render).catch(() => { syncButtons(); });
}

// 최상위 await를 쓰지 않는다 — Safari 15+/Chrome 89+ 미만에서는 모듈 전체가 파싱 실패해
// 아무 리스너도 붙지 않는 채로 죽어버린다. .then/.catch만으로 같은 순서를 보장한다.
const preview = previewConfig();
if (preview) {
  boot(preview);
} else {
  loadConfig().then(boot);
}
</script>
</body>
</html>
