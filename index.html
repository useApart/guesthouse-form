<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>게스트하우스 신청서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #F5F4F0; color: #1E251E; }
  .wrap { min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px 64px; }
  .inner { width: 100%; max-width: 560px; }
  .eyebrow { text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: #7A8177; margin-bottom: 6px; }
  h1 { text-align: center; margin: 0 0 24px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .tabs { display: flex; background: #EAE8E1; border-radius: 14px; padding: 4px; margin-bottom: 20px; gap: 4px; }
  .tab { flex: 1; height: 44px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; background: transparent; color: #7A8177; }
  .tab.active { background: #fff; color: #1F6D57; box-shadow: 0 1px 2px rgba(30,37,30,.08); }
  .card { background: #fff; border-radius: 20px; border: 1px solid #E8E6DE; box-shadow: 0 1px 3px rgba(30,37,30,.04); padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; }
  form { display: flex; flex-direction: column; gap: 18px; }
  /* 아이콘 + 플로팅 라벨 리스트 (한 컨테이너에 세로로 쌓기) */
  .field-list { border: 1px solid #E2E0D8; border-radius: 16px; background: #fff; }
  .frow { position: relative; display: flex; align-items: center; padding: 10px 18px; min-height: 66px; }
  .frow + .frow { border-top: 1px solid #ECEAE3; }
  .frow-body { position: relative; flex: 1; min-width: 0; padding-top: 14px; }
  .frow-body > label {
    position: absolute; left: 0; top: 50%; transform: translateY(-50%); margin: 0;
    font-size: 16px; font-weight: 400; color: #9A9F92; pointer-events: none;
    transition: top .15s, font-size .15s, transform .15s; white-space: nowrap;
  }
  .frow-body input {
    width: 100%; border: none; background: transparent; padding: 0;
    font-size: 16px; font-weight: 500; color: #1E251E; height: 28px; line-height: 28px; font-family: inherit;
  }
  .frow-body input:focus { outline: none; }
  .frow-body input[readonly] { cursor: pointer; }
  /* 자동 계산 표시칸. 단위가 붙는 칸(금액)은 사용자가 가장 주목하는 값이라
     흐리게 하지 않는다. 리팩터 전 #nightsOut/#amount 각각의 스타일과 같은 결과다. */
  .frow-body input.readout { cursor: default; color: #7A8177; }
  .frow-body input.readout.has-suffix { color: #1E251E; padding-right: 22px; }
  .dong-ho { display: flex; align-items: center; gap: 8px; }
  .dong-ho input { flex: 1; min-width: 0; height: 42px; border: 1px solid #DDDBD2; border-radius: 9px; padding: 0 12px; font-size: 16px; font-family: inherit; color: #1E251E; background: #fff; }
  .dong-ho input:focus { outline: none; border-color: #B7B5AC; }
  .dh-dash { color: #9A9F92; font-weight: 600; }
  .frow-body input:focus ~ label,
  .frow-body input:not(:placeholder-shown) ~ label { top: 0; transform: none; font-size: 12px; }
  /* 활성(포커스) 행 강조: 리스트 컨테이너의 실제 모서리에 맞춰 테두리를 진하게.
     첫 행(신청일)은 상단만, 마지막 행(은행입금일)은 하단만 둥글게, 중간은 각지게. */
  .frow:focus-within { background: #FAFAF8; }
  .frow:focus-within::after {
    content: ''; position: absolute; inset: -1px; border: 2px solid #6B7280;
    border-radius: 0; pointer-events: none;
  }
  .field-list .frow:first-child:focus-within { border-radius: 16px 16px 0 0; }
  .field-list .frow:first-child:focus-within::after { border-radius: 16px 16px 0 0; }
  .field-list .frow:last-child:focus-within { border-radius: 0 0 16px 16px; }
  .field-list .frow:last-child:focus-within::after { border-radius: 0 0 16px 16px; }
  .frow-body .won { position: absolute; right: 0; bottom: 4px; font-size: 14px; color: #9A9F92; }
  /* 사용인원: 플로팅 없이 상단 라벨 + 버튼 */
  .frow-static { padding-top: 0; }
  .frow-slabel { font-size: 12px; color: #9A9F92; margin-bottom: 8px; }

  .cal-pop {
    position: fixed; z-index: 1000; width: 296px; max-width: calc(100vw - 16px);
    background: #fff; border: 1px solid #E8E6DE; border-radius: 14px;
    box-shadow: 0 8px 24px rgba(30,37,30,.18); padding: 12px; display: none;
  }
  .cal-pop.show { display: block; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .cal-nav { width: 38px; height: 38px; border: none; background: #F5F4F0; border-radius: 10px; font-size: 18px; font-weight: 700; color: #3C443B; cursor: pointer; font-family: inherit; }
  .cal-nav:hover { background: #EAE8E1; }
  .cal-label { font-size: 15px; font-weight: 700; }
  .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; color: #7A8177; margin-bottom: 4px; }
  .cal-week span:first-child { color: #C0392B; }
  .cal-week span:last-child { color: #2E5AA8; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .cal-blank { height: 38px; }
  .cal-day { height: 38px; border: none; background: none; border-radius: 10px; font-size: 14px; font-family: inherit; color: #1E251E; cursor: pointer; }
  .cal-day:hover { background: #F5F4F0; }
  .cal-day.cal-sun { color: #C0392B; }
  .cal-day.cal-sat { color: #2E5AA8; }
  .cal-day.cal-today { font-weight: 700; box-shadow: inset 0 0 0 1.5px #1F6D57; }
  .cal-day.cal-selected { background: #1F6D57; color: #fff; }
  .cal-day.cal-disabled { color: #CFCDC4; cursor: default; }
  .cal-day.cal-disabled:hover { background: none; }
  .cal-foot { display: flex; gap: 8px; margin-top: 8px; }
  .cal-action { flex: 1; height: 38px; border-radius: 10px; border: 1px solid #DDDBD2; background: #fff; font-size: 13px; font-weight: 600; color: #3C443B; cursor: pointer; font-family: inherit; }
  .cal-action:hover { background: #F5F4F0; }
  .link-btn {
    align-self: flex-start; background: none; border: none; padding: 4px 0; margin-top: -8px;
    font-size: 12px; color: #7A8177; text-decoration: underline; cursor: pointer; font-family: inherit;
  }
  .guest-row { display: flex; gap: 8px; }
  .guest-btn { flex: 1; height: 42px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; border: 1px solid #DDDBD2; background: #fff; color: #3C443B; }
  .guest-btn.active { border: 1.5px solid #1F6D57; background: #EAF3EF; color: #1F6D57; }
  .summary { margin: 0; font-size: 13px; color: #7A8177; }
  .warning { margin: 0; font-size: 13px; color: #C0392B; font-weight: 700; }
  #canvas {
    width: 100%; height: auto; display: block; border: 1px solid #E8E6DE; border-radius: 16px;
    background: #fff;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .btn { flex: 1; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; border: none; }
  .btn-primary { background: #1F6D57; color: #fff; }
  .btn-primary:hover { background: #195C49; }
  .btn-secondary { background: #fff; color: #3C443B; border: 1px solid #D8D6CD; }
  .btn-secondary:hover { background: #F5F4F0; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-secondary:disabled:hover { background: #fff; }
  .btn-primary:disabled:hover { background: #1F6D57; }
  .status-msg { margin: -8px 0 0; font-size: 13px; color: #7A8177; min-height: 1.2em; }
  .account { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px 12px; padding: 16px; border-radius: 12px; background: #F5F4F0; margin-top: 6px; }
  .account .acc-info { min-width: 0; flex: 1 1 200px; }
  .account .num { font-size: 15px; font-weight: 700; word-break: break-word; }
  .account .name { font-size: 13px; color: #7A8177; margin-top: 2px; }
  .copy-btn { flex-shrink: 0; height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #D8D6CD; background: #fff; color: #3C443B; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .clear-link { background: none; border: none; color: #9A9F92; font-size: 13px; cursor: pointer; text-decoration: underline; font-family: inherit; padding: 4px 2px; }
  .top-actions { display: flex; justify-content: flex-end; margin: -12px 0 14px; }
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: #1E251E; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .build { margin: 20px 0 16px; text-align: center; font-size: 11px; color: #9A9F92; }
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <div class="eyebrow" id="siteOrg">원흥LH13단지주거복지지원센터</div>
    <h1 id="siteTitle">게스트하우스 신청서</h1>

    <div class="tabs">
      <button class="tab active" type="button">타이핑으로 작성</button>
      <a href="draw.html" style="text-decoration:none; flex:1;">
        <button class="tab" type="button" style="width:100%;">손으로 직접 쓰기</button>
      </a>
    </div>

    <div class="top-actions">
      <button type="button" class="clear-link" id="clearSaved">저장정보 초기화</button>
    </div>

    <div class="card">
      <form id="form" autocomplete="on">
        <!-- 입력 행은 config.fields에서 생성된다. buildForm() 참조. -->
        <div class="field-list" id="fieldList"></div>

        <p id="warning" class="warning" hidden></p>
      </form>

      <canvas id="canvas" width="707" height="1000"></canvas>

      <div class="btn-row">
        <button type="button" id="share" class="btn btn-primary" disabled>이미지 만들어 보내기</button>
        <button type="button" id="download" class="btn btn-secondary" disabled>이미지 저장</button>
      </div>
      <p id="status" class="status-msg"></p>

      <div class="account">
        <div class="acc-info">
          <div class="num" id="accountNumber">국민 856901-00-129046</div>
          <div class="name" id="accountHolder">원흥LH13단지주거복지지원센터</div>
        </div>
        <button type="button" class="copy-btn" id="copyAccount">계좌번호 복사</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<p class="build" id="build"></p>

<script type="module">
import { countNights, calcAmount } from './calc.js';
import {
  DEFAULT_CONFIG, clone, loadConfig, normalizeConfig,
  formFields, printedCells, derive, domIds,
} from './config.js';
import { bumpUsage } from './usage.js';
import { detectMobile } from './device.js';

// 폰이면 저장에 공유 시트를 쓴다(사진함). PC면 파일로 내려받는다.
// 이 값은 페이지가 열려 있는 동안 바뀌지 않으므로 한 번만 읽는다.
const isMobile = detectMobile();

const $ = (id) => document.getElementById(id);

// 이 화면이 언제 배포된 것인지 화면 아래에 작게 표시한다.
// document.lastModified는 서버가 준 Last-Modified 헤더다 — 브라우저가 실제로 들고
// 있는 파일의 시각이라, 캐시된 옛 파일을 보고 있으면 옛 시각이 뜬다. 그래서
// "고친 게 반영됐나?"를 이 한 줄로 확인할 수 있다. GitHub Pages는 배포할 때마다
// 모든 파일에 같은 시각을 달아 준다(Cache-Control: max-age=600).
$('build').textContent = new Date(document.lastModified).toLocaleString('ko-KR', {
  year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false,
}) + ' 배포';

const canvas = $('canvas');
const ctx = canvas.getContext('2d');

// 설정을 읽기 전에도 화면이 동작해야 하므로 내장 기본값에서 시작한다.
let config = clone(DEFAULT_CONFIG);

// 설정에서 유도되는 값들. boot()에서 buildDerived()가 채운다.
let POS = {};          // 서식에 찍을 칸의 중심 좌표
let REQUIRED = {};     // id -> 라벨. 비어 있으면 내보내기 버튼을 잠근다
let SAVED_IDS = [];    // localStorage에 기억할 DOM id
let CLEARABLE = new Set();
let DATE_FIELDS = [];
let ACCOUNT_TEXT = '';

// 유도 로직은 config.js의 derive()에 있다. DOM에 얽히지 않은 순수 함수라
// 값이 리팩터 전 하드코딩 상수와 같은지 테스트로 고정되어 있다.
function buildDerived() {
  const d = derive(config);
  POS = d.positions;
  REQUIRED = d.required;
  SAVED_IDS = d.rememberedIds;
  CLEARABLE = new Set(d.clearableIds);
  DATE_FIELDS = d.dateIds;
  ACCOUNT_TEXT = d.accountText;
}

// ---- 폼 생성 ----
// 마크업은 리팩터 전 손으로 쓰던 것과 클래스까지 동일하다. CSS를 건드리지 않기 위함이다.
// 플로팅 라벨은 placeholder=" "와 :not(:placeholder-shown)으로 동작하므로
// 라벨은 반드시 input 뒤에 와야 한다.

function el(tag, className, props) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  Object.assign(node, props || {});
  return node;
}

function buildFloatingRow(field) {
  const body = el('div', 'frow-body');
  let input;

  if (field.input === 'date') {
    input = el('input', 'date-in', { type: 'text', id: field.id, readOnly: true, placeholder: ' ' });
  } else if (field.input === 'readout') {
    input = el('input', 'readout' + (field.suffix ? ' has-suffix' : ''), {
      type: 'text', id: field.id, readOnly: true, placeholder: ' ',
    });
  } else {
    input = el('input', null, {
      type: field.input === 'phone' ? 'tel' : 'text',
      id: field.id,
      placeholder: field.placeholder || ' ',
      maxLength: field.maxlength || 20,
    });
  }

  body.appendChild(input);
  body.appendChild(el('label', null, { htmlFor: field.id, textContent: field.label }));
  if (field.input === 'readout' && field.suffix) {
    body.appendChild(el('span', 'won', { textContent: field.suffix }));
  }
  return body;
}

// 동·호수와 사용인원은 플로팅 라벨을 쓰지 않고 위에 작은 라벨을 둔다.
function buildStaticRow(field, content) {
  const body = el('div', 'frow-body frow-static');
  body.appendChild(el('div', 'frow-slabel', { textContent: field.label }));
  content.forEach((node) => body.appendChild(node));
  return body;
}

function buildUnitRow(field) {
  const wrap = el('div', 'dong-ho');
  wrap.appendChild(el('input', null, {
    type: 'text', id: field.id + 'Dong', inputMode: 'numeric',
    placeholder: '동 (' + field.dongLength + '자리)', maxLength: field.dongLength,
  }));
  wrap.appendChild(el('span', 'dh-dash', { textContent: '-' }));
  wrap.appendChild(el('input', null, {
    type: 'text', id: field.id + 'Ho', inputMode: 'numeric',
    placeholder: '호 (' + field.hoLength + '자리)', maxLength: field.hoLength,
  }));
  return buildStaticRow(field, [wrap]);
}

function buildChoiceRow(field) {
  const row = el('div', 'guest-row', { id: 'guestRow' });
  config.pricing.peopleOptions.forEach((n, i) => {
    const btn = el('button', 'guest-btn' + (i === 0 ? ' active' : ''), {
      type: 'button', textContent: n + '명',
    });
    btn.dataset.n = String(n);
    row.appendChild(btn);
  });
  const hidden = el('input', null, {
    type: 'hidden', id: field.id, value: String(config.pricing.peopleOptions[0]),
  });
  return buildStaticRow(field, [row, hidden]);
}

function buildForm() {
  const host = $('fieldList');
  host.textContent = '';
  for (const field of formFields(config)) {
    const row = el('div', 'frow');
    if (field.input === 'unit') row.appendChild(buildUnitRow(field));
    else if (field.input === 'choice') row.appendChild(buildChoiceRow(field));
    else row.appendChild(buildFloatingRow(field));
    host.appendChild(row);
  }
}

function applySiteTexts() {
  $('siteOrg').textContent = config.site.org;
  $('siteTitle').textContent = config.site.title;
  document.title = config.site.title;
  $('accountNumber').textContent = config.account.bank + ' ' + config.account.number;
  $('accountHolder').textContent = config.account.holder;
}

// 'loading' | 'ready' | 'error'. 이미지가 준비되지 않은 동안은 버튼을 잠그고 캔버스에 아무것도 그리지 않는다.
let imageState = 'loading';

const formImage = new Image();
const imageReady = new Promise((resolve, reject) => {
  formImage.onload = () => { imageState = 'ready'; resolve(); };
  formImage.onerror = () => {
    imageState = 'error';
    reject(new Error('서식 이미지를 불러오지 못했습니다.'));
  };
});

function drawForm(text) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 준비 전/실패 시에는 그리지 않고 멈춘다. 이 상태에서 내보내기가 아예 불가능하도록
  // 만드는 것은 syncButtons()의 버튼 잠금이며, 여기서는 오래된 내용만 지운다.
  if (imageState !== 'ready') return;
  try {
    ctx.drawImage(formImage, 0, 0, canvas.width, canvas.height);
  } catch {
    // drawImage가 InvalidStateError를 던지는 경우(이미지가 깨진 상태). render()가 여기서 멈추지 않도록 흡수한다.
    imageState = 'error';
    return;
  }
  ctx.fillStyle = '#000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const [key, pos] of Object.entries(POS)) {
    const value = text[key];
    if (!value) continue;

    // 칸을 넘치면 들어갈 때까지 폰트를 줄인다.
    let size = 14;
    ctx.font = `${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
    while (ctx.measureText(value).width > pos.maxWidth && size > 8) {
      size -= 1;
      ctx.font = `${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
    }
    ctx.fillText(value, pos.x, pos.y);
  }
}

function readValues() {
  // holiday는 수동 토글이 아니라 특일정보 API로 판정한다. calcAmount에는
  // isHoliday 함수로 넘기므로 여기서는 항상 false다.
  const values = { holiday: false };

  for (const field of formFields(config)) {
    if (field.input === 'unit') {
      const dongEl = $(field.id + 'Dong');
      const hoEl = $(field.id + 'Ho');
      const dong = dongEl ? dongEl.value.trim() : '';
      const ho = hoEl ? hoEl.value.trim() : '';
      values[field.id] = (dong && ho) ? dong + '동 ' + ho + '호' : '';
      continue;
    }
    const node = $(field.id);
    if (!node) continue;
    if (field.input === 'choice') values[field.id] = Number(node.value);
    else values[field.id] = node.value.trim();
  }

  // 금액 칸은 '70,000' 같은 문자열이라 계산에 쓰려면 숫자로 되돌린다.
  const amountText = String(values.amount || '');
  values.amount = Number(amountText.replace(/[^0-9]/g, ''));
  values.amountEntered = /[0-9]/.test(amountText);
  return values;
}

// 입실일·퇴실일로 사용기간 문자열을 만든다. 칸이 136px로 좁아 'YYYY-MM-DD ~ YYYY-MM-DD'를
// 그대로 넣으면 폰트가 심하게 줄어든다. 그래서 연도는 앞에 한 번만 쓰고 월·일의 앞자리 0은
// 뗀다. 연도가 바뀌는 경우(예: 12월→1월)에만 뒤쪽 날짜에도 연도를 붙인다.
function shortDate(checkIn, checkOut) {
  if (!checkIn || !checkOut) return '';
  const [y1, m1, d1] = checkIn.split('-').map(Number);
  const [y2, m2, d2] = checkOut.split('-').map(Number);
  const end = y1 === y2 ? `${m2}.${d2}` : `${y2}.${m2}.${d2}`;
  return `${y1}.${m1}.${d1} ~ ${end}`;
}

// 'YYYY-MM-DD' -> 'YYYY.M.D'. 은행입금일 칸(136px)도 사용기간과 같은 이유로 앞자리 0을 뗀다.
function compactDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  return `${y}.${m}.${d}`;
}

function formatValues(v, nights) {
  const out = {};
  for (const field of printedCells(config)) {
    const id = field.id;
    if (id === 'period') {
      out[id] = (v.checkIn && v.checkOut) ? shortDate(v.checkIn, v.checkOut) : '';
    } else if (id === 'nights') {
      out[id] = nights ? nights + '일' : '';
    } else if (id === 'amount') {
      out[id] = v.amountEntered ? v.amount.toLocaleString('ko-KR') + '원' : '';
    } else if (field.input === 'choice') {
      out[id] = v[id] ? v[id] + '명' : '';
    } else if (field.input === 'date') {
      out[id] = v[id] ? compactDate(v[id]) : '';
    } else {
      out[id] = v[id] || '';
    }
  }
  return out;
}

// 금액과 사용일수는 항상 자동 계산이며 사용자가 직접 고칠 수 없다(readonly).

// 입력할 때마다 허용하지 않는 문자를 지운다. 성명에 숫자가 섞이거나 동·호수에
// 한글이 들어가는 오입력을 막는다.
const CHARSET_PATTERNS = {
  korean: /[^가-힣ㄱ-ㅎㅏ-ㅣ\s]/g,
  digits: /[^0-9]/g,
};

function filterInput(node, re) {
  node.addEventListener('input', () => {
    const cleaned = node.value.replace(re, '');
    if (cleaned !== node.value) node.value = cleaned;
  });
}

// ---- 공휴일 정보 (한국천문연구원 특일정보 API, data.go.kr) ----
// 아래에 발급받은 '디코딩(Decoding)' 서비스키를 넣으면 공휴일이 40,000원으로 계산된다.
// 키가 없으면 공휴일 판정만 꺼지고(주말 요금 규칙은 그대로) 나머지는 정상 동작한다.
const HOLIDAY_SERVICE_KEY = 'E76T369vFiqcgIhUNIY/I4Tn67sd1bRWatkjjBszNj60WTgjDFjTE5XTMVeySm5Z0L2x8YxhW+NqQfquLYvJwg==';
const holidaySet = new Set();      // 'YYYY-MM-DD' 공휴일 모음
const holidayYearsTried = new Set();

function isHoliday(dateObj) {
  return holidaySet.has(toDateStr(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate()));
}

async function loadHolidays(year) {
  if (!year || holidayYearsTried.has(year)) return;
  if (!config.holiday.enabled) return;
  if (!HOLIDAY_SERVICE_KEY || HOLIDAY_SERVICE_KEY.startsWith('PUT_YOUR')) return;
  holidayYearsTried.add(year);

  // 캐시가 있으면 그대로 사용한다.
  try {
    const cached = JSON.parse(localStorage.getItem(`holidays-${year}`) || 'null');
    if (cached) { cached.forEach((d) => holidaySet.add(d)); render(); return; }
  } catch { /* 캐시 손상 무시 */ }

  try {
    const found = [];
    for (let mo = 1; mo <= 12; mo++) {
      const url = 'https://apis.data.go.kr/B090041/openapi/service/SpcdeInfoService/getRestDeInfo'
        + `?serviceKey=${encodeURIComponent(HOLIDAY_SERVICE_KEY)}`
        + `&solYear=${year}&solMonth=${pad2(mo)}&numOfRows=50&_type=json`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      let items = json?.response?.body?.items?.item;
      if (!items) continue;
      if (!Array.isArray(items)) items = [items];
      for (const it of items) {
        if (String(it.isHoliday).trim() === 'Y') {
          const ymd = String(it.locdate); // 예: 20260101
          found.push(`${ymd.slice(0, 4)}-${ymd.slice(4, 6)}-${ymd.slice(6, 8)}`);
        }
      }
    }
    found.forEach((d) => holidaySet.add(d));
    try { localStorage.setItem(`holidays-${year}`, JSON.stringify(found)); } catch { /* 저장 실패 무시 */ }
    render();
  } catch {
    // 네트워크/키 오류: 매 입력마다 재요청하지 않도록 표시는 유지한다(새로고침 시 재시도).
  }
}

function render() {
  const v = readValues();
  const nights = countNights(v.checkIn, v.checkOut);

  // 사용기간에 걸친 연도의 공휴일을 확보한다(공휴일 전날 규칙 때문에 다음해도 함께).
  if (v.checkIn) loadHolidays(Number(v.checkIn.slice(0, 4)));
  if (v.checkOut) { const yr = Number(v.checkOut.slice(0, 4)); loadHolidays(yr); loadHolidays(yr + 1); }

  const auto = calcAmount(v, {
    pricing: config.pricing,
    isHoliday,
    eveOfHoliday: config.holiday.eveOfHoliday,
  });
  const amountEl = $('amount');
  if (amountEl) amountEl.value = auto ? auto.toLocaleString('ko-KR') : '';
  v.amount = auto;
  v.amountEntered = auto > 0;
  const nightsEl = $('nights');
  if (nightsEl) nightsEl.value = nights ? nights + '일' : '';

  const warn = $('warning');
  // 퇴실일<=입실일 상태의 안내는 #status(syncButtons)에서만 표시한다 — 여기서 같은 문장을 또 띄우지 않는다.
  // 버튼은 그와 무관하게 syncButtons()가 계속 잠근다.
  if (v.checkIn && v.checkOut && nights === 0) {
    warn.hidden = true;
  } else if (nights > config.stay.maxNights) {
    // 문구를 저장하지 않고 제한값에서 만든다. 제한을 바꾸면 문구도 같이 바뀐다.
    warn.textContent = '운영규정상 1세대는 ' + config.stay.maxNights + '박까지만 사용할 수 있습니다.';
    warn.hidden = false;
  } else {
    warn.hidden = true;
  }

  drawForm(formatValues(v, nights));
  syncButtons();
}

function missingFields(v) {
  return Object.entries(REQUIRED).filter(([k]) => !v[k]).map(([, label]) => label);
}

function toJpegFile() {
  const v = readValues();
  // 신청일은 기본 설정에서 필수라 버튼이 활성화된 시점엔 항상 있다.
  // 관리자가 필수를 해제했을 경우를 대비해 빈 값도 견디게 둔다.
  const stamp = String(v.applyDate || '').replace(/-/g, '');
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      (blob) => {
        if (!blob) return reject(new Error('이미지 생성에 실패했습니다.'));
        resolve(new File([blob], `게스트하우스신청서_${stamp}.jpg`, { type: 'image/jpeg' }));
      },
      'image/jpeg',
      0.92
    );
  });
}

// #status는 "계속 화면에 남아 있어야 하는" 검증/게이팅 안내 전용이다(입력 누락, 날짜 역전,
// 서식 이미지 로딩/실패, 5박 이상 경고 등). syncButtons()에서만 값을 채운다.
function setStatus(msg) { $('status').textContent = msg; }

// 저장했습니다/복사됨/공유 관련 안내처럼 순간적으로 보여주면 되는 메시지는 토스트로 띄운다.
let toastTimer;
function showToast(msg) {
  const toast = $('toast');
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

// 필수값이 비거나 숙박일수가 0이거나 서식 이미지가 준비되지 않았으면 버튼을 잠근다.
// render()의 마지막 줄뿐 아니라 이미지 로딩 완료/실패 시에도 별도로 호출된다.
function syncButtons() {
  const v = readValues();
  const missing = missingFields(v);
  const invalidStay = v.checkIn && v.checkOut && countNights(v.checkIn, v.checkOut) === 0;
  const blocked = imageState !== 'ready' || missing.length > 0 || invalidStay;
  $('share').disabled = blocked;
  $('download').disabled = blocked;
  if (imageState === 'error') {
    setStatus('서식 이미지를 불러오지 못했습니다. 새로고침해 주세요.');
  } else if (missing.length > 0) {
    setStatus(`입력이 필요합니다: ${missing.join(', ')}`);
  } else if (invalidStay) {
    setStatus('퇴실일은 입실일보다 뒤여야 합니다.');
  } else if (imageState === 'loading') {
    setStatus('서식 이미지를 불러오는 중입니다...');
  } else {
    setStatus('');
  }
}

$('share').addEventListener('click', async () => {
  try {
    const file = await toJpegFile();
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      // 공유 시트가 실제로 뜨는 경우만 센다. await 하지 않는다 — 집계가 늦거나
      // 실패해도 주민은 아무 차이를 느끼면 안 된다. 시트를 취소해도 이미지는
      // 이미 만들어졌으므로 그대로 센다. 관리자 미리보기(admin.html의 iframe)에서
      // 누른 것은 실제 신청이 아니므로 세지 않는다.
      bumpUsage(isPreview ? null : config.reservation, 'typed');
      await navigator.share({ files: [file], title: config.site.title });
      return;
    }
    showToast('이 브라우저는 공유를 지원하지 않습니다. "이미지 저장"을 눌러 주세요.');
  } catch (err) {
    // 사용자가 공유 시트를 닫은 경우는 오류가 아니다.
    if (err.name === 'AbortError') { return; }
    // iOS 사파리 등에서 사용자 제스처 타이밍 문제로 공유가 실패하는 사례가 흔하다.
    // 영어 브라우저 오류 대신 대안 행동을 안내한다.
    showToast('공유하지 못했습니다. "이미지 저장"을 눌러 저장한 뒤 문자메시지에 직접 첨부해 주세요.');
  }
});

$('download').addEventListener('click', async () => {
  try {
    const file = await toJpegFile();
    // 관리자 미리보기(admin.html의 iframe)에서 누른 것은 실제 신청이 아니므로 세지 않는다.
    bumpUsage(isPreview ? null : config.reservation, 'typed');
    // 폰(iOS/안드로이드)에서는 <a download>로는 사진함에 저장되지 않는다.
    // 공유 시트를 열면 사용자가 '이미지 저장'을 눌러 사진함에 바로 저장할 수 있다.
    //
    // 여기서 canShare만 보면 안 된다. Windows의 Chrome·Edge도 파일 공유를
    // 지원해서 PC가 이 분기를 타 버리고, Windows 공유 대화상자에는 '파일로
    // 저장'에 해당하는 항목이 없어 저장할 방법이 사라진다.
    if (isMobile && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: config.site.title });
      return;
    }
    // 공유 파일이 지원되지 않는 환경(주로 PC)에서는 파일로 내려받는다.
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    a.click();
    // 클릭 직후 바로 해제하면 일부 브라우저(특히 데스크톱 사파리)는 비동기로 다운로드를
    // 시작하다가 이미 해제된 URL을 만나 실패한다. 게다가 크롬의 "다운로드 전에 각 파일의
    // 저장 위치 확인"을 켜두면 사용자가 폴더를 고르는 동안 다운로드가 시작되지 않는다.
    // 폴더를 뒤적이는 시간까지 넉넉히 기다린다.
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    // "저장했습니다" 토스트는 두지 않는다. <a download>는 사용자가 실제로 저장했는지
    // 취소했는지 알려주지 않아, 취소한 사람에게도 성공했다고 거짓말을 하게 된다.
    // 브라우저가 자기 다운로드 UI로 이미 알려준다.
  } catch (err) {
    if (err.name === 'AbortError') { return; }
    showToast(`이미지를 만들지 못했습니다: ${err.message}`);
  }
});

// 폼이 동적으로 생성되므로 리스너는 반드시 buildForm() 이후에 붙인다.
function attachFieldListeners() {
  for (const field of formFields(config)) {
    if (field.input === 'unit') {
      // 동·호는 언제나 숫자만 받는다.
      for (const id of domIds(field)) {
        const node = $(id);
        if (node) filterInput(node, CHARSET_PATTERNS.digits);
      }
    } else if (field.input === 'phone') {
      // 연락처는 formatPhone이 숫자만 남기고 하이픈을 자동으로 넣는다.
      const node = $(field.id);
      if (node) {
        node.addEventListener('input', (e) => {
          const formatted = formatPhone(e.target.value);
          if (formatted !== e.target.value) e.target.value = formatted;
        });
      }
    } else if (field.input === 'text' && CHARSET_PATTERNS[field.charset]) {
      const node = $(field.id);
      if (node) filterInput(node, CHARSET_PATTERNS[field.charset]);
    } else if (field.input === 'date') {
      const node = $(field.id);
      // pointerdown에서 네이티브 포커스를 막아(=포커스 시 페이지가 칸으로 스크롤되는 것 방지)
      // 직접 preventScroll로 포커스만 준다. 포커스 링은 그대로 유지된다.
      if (node) {
        node.addEventListener('pointerdown', (e) => {
          e.preventDefault();
          node.focus({ preventScroll: true });
          openCalendar(node);
        });
      }
    }

    for (const id of domIds(field)) {
      const node = $(id);
      if (node && field.remember) node.addEventListener('input', saveFields);
    }
  }

  // 사용인원: 시각은 버튼들, 실제 값은 숨김 입력에 저장한다.
  const guestRow = $('guestRow');
  if (guestRow) {
    guestRow.addEventListener('click', (e) => {
      const btn = e.target.closest('.guest-btn');
      if (!btn) return;
      const hidden = guestRow.parentNode.querySelector('input[type="hidden"]');
      if (hidden) hidden.value = btn.dataset.n;
      guestRow.querySelectorAll('.guest-btn').forEach((b) => b.classList.toggle('active', b === btn));
      render();
    });
  }

  $('form').addEventListener('input', render);
  // select/checkbox의 input 이벤트가 일부 구형 WebKit/WebView에서 누락되는 경우를 대비한 보강.
  $('form').addEventListener('change', render);
}

// 오늘을 기본값으로 넣을 날짜 칸을 채운다. (sv-SE 로케일은 YYYY-MM-DD 형식을 준다)
function setTodayDefaults() {
  const today = new Date().toLocaleDateString('sv-SE');
  for (const field of formFields(config)) {
    if (field.input === 'date' && field.defaultToday && $(field.id)) $(field.id).value = today;
  }
}

// 연락처를 입력하는 대로 하이픈을 자동으로 넣는다. 숫자만 남긴 뒤 지역/앞자리·중간·끝4자리로 끊는다.
function formatPhone(value) {
  const digits = value.replace(/\D/g, '').slice(0, 11);
  if (digits.length < 4) return digits;
  const a = digits.startsWith('02') ? 2 : 3; // 서울(02)만 지역번호 2자리, 그 외는 3자리
  const rest = digits.slice(a);
  if (rest.length <= 4) return `${digits.slice(0, a)}-${rest}`;
  return `${digits.slice(0, a)}-${rest.slice(0, -4)}-${rest.slice(-4)}`;
}
// 날짜는 년-월-일 순서를 기기 설정과 무관하게 고정하기 위해 직접 입력 대신 커스텀 달력
// 팝오버로 받는다. 모든 날짜 칸이 팝오버 하나를 공유한다.

let calTarget = null; // 현재 팝오버가 붙어 있는 input 엘리먼트
let calYear = 0;
let calMonth = 0; // 0-11

function pad2(n) { return String(n).padStart(2, '0'); }
// toISOString()은 로컬 타임존에 따라 날짜가 하루 밀릴 수 있어 쓰지 않는다.
// year/month/day를 그대로 문자열로 조립한다.
function toDateStr(y, m, d) { return `${y}-${pad2(m + 1)}-${pad2(d)}`; }

function parseDateStr(s) {
  if (!s) return null;
  const [y, m, d] = s.split('-').map(Number);
  if (!y || !m || !d) return null;
  return { y, m: m - 1, d };
}

// 선택 가능 범위(입실일 기준 최대 2박). null이면 제한 없음.
let calMin = null, calMax = null;
function addDaysFrom(dateStr, n) {
  const p = parseDateStr(dateStr);
  if (!p) return null;
  return new Date(p.y, p.m, p.d + n);
}
function computeBounds(input) {
  calMin = null; calMax = null;
  // 공통: 오늘부터 stay.maxAheadMonths개월 뒤(같은 날)까지만. 과거·초과는 막는다.
  if (config.stay.limitDates) {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    calMin = t;
    calMax = new Date(t.getFullYear(), t.getMonth() + config.stay.maxAheadMonths, t.getDate());
  }
  // 퇴실일은 추가로 입실일 +minNights ~ +maxNights 안에서만 고를 수 있다(공통 범위와 교집합).
  if (input.id === 'checkOut') {
    const lo = addDaysFrom($('checkIn').value, config.stay.minNights);
    const hi = addDaysFrom($('checkIn').value, config.stay.maxNights);
    if (lo && (!calMin || lo > calMin)) calMin = lo;
    if (hi && (!calMax || hi < calMax)) calMax = hi;
  }
}
function outOfBounds(y, m, d) {
  const dt = new Date(y, m, d);
  if (calMin && dt < calMin) return true;
  if (calMax && dt > calMax) return true;
  return false;
}

function renderCalendarGrid() {
  calLabel.textContent = `${calYear}년 ${calMonth + 1}월`;
  const selected = parseDateStr(calTarget ? calTarget.value : '');
  const firstWeekday = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const today = new Date();

  calGrid.innerHTML = '';
  for (let i = 0; i < firstWeekday; i++) {
    const blank = document.createElement('span');
    blank.className = 'cal-blank';
    calGrid.appendChild(blank);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cal-day';
    btn.textContent = String(d);
    const dow = new Date(calYear, calMonth, d).getDay();
    if (dow === 0) btn.classList.add('cal-sun');
    if (dow === 6) btn.classList.add('cal-sat');
    if (selected && selected.y === calYear && selected.m === calMonth && selected.d === d) {
      btn.classList.add('cal-selected');
    }
    if (today.getFullYear() === calYear && today.getMonth() === calMonth && today.getDate() === d) {
      btn.classList.add('cal-today');
    }
    if (outOfBounds(calYear, calMonth, d)) {
      btn.classList.add('cal-disabled');
      btn.disabled = true;
    } else {
      btn.addEventListener('click', () => selectDate(d));
    }
    calGrid.appendChild(btn);
  }
}

function selectDate(d) {
  if (!calTarget) return;
  if (outOfBounds(calYear, calMonth, d)) return;
  const wasCheckIn = calTarget.id === 'checkIn';
  calTarget.value = toDateStr(calYear, calMonth, d);
  // 입실일을 바꾸면 기존 퇴실일이 범위(1~2박)를 벗어날 수 있으니 정리한다.
  if (wasCheckIn) {
    const co = $('checkOut').value;
    if (co) {
      const n = countNights($('checkIn').value, co);
      if (n < config.stay.minNights || n > config.stay.maxNights) $('checkOut').value = '';
    }
  }
  closeCalendar();
  render();
  // 입실일을 고르면 퇴실일이 비어 있을 때 곧바로 퇴실일 달력을 열어 준다.
  if (wasCheckIn && !$('checkOut').value) {
    const co = $('checkOut');
    co.focus({ preventScroll: true });
    openCalendar(co);
  }
}

// 카드 밖으로 잘리지 않도록 body에 붙여 놓은 팝오버를 탭한 칸의 위치에 맞춰 옮긴다.
// 화면 아래로 넘치면 칸 위쪽에, 오른쪽으로 넘치면 왼쪽으로 당겨 360px 폭 화면에서도 맞춘다.
function positionCalendar() {
  if (!calTarget) return;
  const rect = calTarget.getBoundingClientRect();
  const popW = calPop.offsetWidth || 296;
  const popH = calPop.offsetHeight || 340;
  const margin = 8;
  let left = Math.min(rect.left, window.innerWidth - popW - margin);
  left = Math.max(left, margin);
  let top = rect.bottom + 6;
  if (top + popH > window.innerHeight - margin) {
    top = rect.top - popH - 6;
  }
  top = Math.max(top, margin);
  calPop.style.left = `${left}px`;
  calPop.style.top = `${top}px`;
}

function openCalendar(input) {
  calTarget = input;
  const parsed = parseDateStr(input.value) || (() => {
    const t = new Date();
    return { y: t.getFullYear(), m: t.getMonth(), d: t.getDate() };
  })();
  calYear = parsed.y;
  calMonth = parsed.m;
  calClearBtn.hidden = !CLEARABLE.has(input.id);
  computeBounds(input);
  renderCalendarGrid();
  calPop.classList.add('show');
  positionCalendar();
}

function closeCalendar() {
  calPop.classList.remove('show');
  calTarget = null;
}

calPop.querySelector('#calPrev').addEventListener('click', () => {
  calMonth -= 1;
  if (calMonth < 0) { calMonth = 11; calYear -= 1; }
  renderCalendarGrid();
  positionCalendar();
});
calPop.querySelector('#calNext').addEventListener('click', () => {
  calMonth += 1;
  if (calMonth > 11) { calMonth = 0; calYear += 1; }
  renderCalendarGrid();
  positionCalendar();
});
calPop.querySelector('#calToday').addEventListener('click', () => {
  const t = new Date();
  calYear = t.getFullYear();
  calMonth = t.getMonth();
  selectDate(t.getDate());
});
calClearBtn.addEventListener('click', () => {
  if (!calTarget) return;
  calTarget.value = '';
  closeCalendar();
  render();
});

document.addEventListener('mousedown', (e) => {
  if (!calPop.classList.contains('show')) return;
  if (calPop.contains(e.target) || e.target === calTarget) return;
  closeCalendar();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && calPop.classList.contains('show')) closeCalendar();
});
window.addEventListener('resize', () => {
  if (calPop.classList.contains('show')) positionCalendar();
});
// 스크롤 시 팝오버가 칸에서 떨어져 보이던 문제: 스크롤에 맞춰 다시 위치를 잡는다.
// capture=true로 내부 스크롤 컨테이너의 스크롤도 잡는다.
window.addEventListener('scroll', () => {
  if (calPop.classList.contains('show')) positionCalendar();
}, true);

async function copyText(text, button) {
  const original = button.dataset.label || button.textContent;
  button.dataset.label = original;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      // http나 구형 브라우저용 폴백.
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      let ok = false;
      try {
        ta.select();
        ok = document.execCommand('copy');
      } finally {
        ta.remove();
        button.focus();
      }
      if (!ok) throw new Error('execCommand 복사 실패');
    }
    button.textContent = '복사됨';
    showToast('계좌번호가 복사되었습니다.');
  } catch {
    button.textContent = '복사 실패';
  }
  setTimeout(() => { button.textContent = original; }, 1500);
}

$('copyAccount').addEventListener('click', (e) => copyText(ACCOUNT_TEXT, e.currentTarget));

// 매번 같은 값만 저장한다(remember). 날짜·인원·금액은 제외.
const STORE_KEY = 'guesthouse-form';

function restoreSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    for (const id of SAVED_IDS) {
      if (saved[id] && $(id)) $(id).value = saved[id];
    }
  } catch {
    // 저장값이 깨졌으면 무시하고 빈 폼으로 시작한다.
  }
}

function saveFields() {
  const data = {};
  for (const id of SAVED_IDS) if ($(id)) data[id] = $(id).value;
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch {
    // 사파리 프라이빗 모드 등 저장이 막힌 환경. 기능 자체는 계속 동작해야 한다.
  }
}

$('clearSaved').addEventListener('click', () => {
  try {
    localStorage.removeItem(STORE_KEY);
  } catch {
    // 저장이 막힌 환경이면 애초에 지울 것도 없다.
  }
  for (const id of SAVED_IDS) if ($(id)) $(id).value = '';
  render();
  showToast('저장된 값을 지웠습니다.');
});

// ---- 부팅 ----

// 관리자 미리보기: admin.html이 sessionStorage에 넣어둔 편집 중인 설정을 우선 쓴다.
const PREVIEW_KEY = 'guesthouse-config-preview';
const isPreview = new URLSearchParams(location.search).has('preview');

function previewConfig() {
  if (!isPreview) return null;
  try {
    const raw = sessionStorage.getItem(PREVIEW_KEY);
    return raw ? normalizeConfig(JSON.parse(raw)) : null;
  } catch {
    return null;
  }
}

// 미리보기에서는 빈 폼 대신 예시 값을 채워 실제 생성될 이미지를 그대로 보여준다.
function fillPreviewSamples() {
  for (const field of formFields(config)) {
    if (field.input === 'unit') {
      if ($(field.id + 'Dong')) $(field.id + 'Dong').value = '101';
      if ($(field.id + 'Ho')) $(field.id + 'Ho').value = '1201';
    } else if (field.input === 'text' && $(field.id) && !$(field.id).value) {
      $(field.id).value = '홍길동';
    } else if (field.input === 'phone' && $(field.id) && !$(field.id).value) {
      $(field.id).value = '010-1234-5678';
    }
  }
  const t = new Date();
  const plus = new Date(t.getFullYear(), t.getMonth(), t.getDate() + config.stay.minNights);
  if ($('checkIn')) $('checkIn').value = t.toLocaleDateString('sv-SE');
  if ($('checkOut')) $('checkOut').value = plus.toLocaleDateString('sv-SE');
}

function boot(loaded) {
  config = loaded;
  buildDerived();
  buildForm();
  applySiteTexts();
  attachFieldListeners();

  canvas.width = config.form.width;
  canvas.height = config.form.height;

  // 오늘 기본값을 먼저 넣고 저장값을 나중에 덮어쓴다 — 기억해 둔 값이 항상 이긴다.
  setTodayDefaults();
  restoreSaved();
  if (isPreview) fillPreviewSamples();

  formImage.src = config.form.image;

  render(); // 이미지가 아직 로딩 중이어도 경고 텍스트와 버튼 잠금 상태를 즉시 반영한다.
  imageReady.then(render).catch(() => { syncButtons(); });
}

// 최상위 await를 쓰지 않는다 — Safari 15+/Chrome 89+ 미만에서는 모듈 전체가 파싱 실패해
// 아무 리스너도 붙지 않는 채로 죽어버린다. .then/.catch만으로 같은 순서를 보장한다.
const preview = previewConfig();
if (preview) {
  boot(preview);
} else {
  loadConfig().then(boot);
}
</script>
