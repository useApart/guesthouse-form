<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>게스트하우스 신청서</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; background: #F5F4F0; color: #1E251E; }
  .wrap { min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px 64px; }
  .inner { width: 100%; max-width: 560px; }
  .eyebrow { text-align: center; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: #7A8177; margin-bottom: 6px; }
  h1 { text-align: center; margin: 0 0 24px; font-size: 26px; font-weight: 700; letter-spacing: -.01em; }
  .tabs { display: flex; background: #EAE8E1; border-radius: 14px; padding: 4px; margin-bottom: 20px; gap: 4px; }
  .tab { flex: 1; height: 44px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; background: transparent; color: #7A8177; }
  .tab.active { background: #fff; color: #1F6D57; box-shadow: 0 1px 2px rgba(30,37,30,.08); }
  .card { background: #fff; border-radius: 20px; border: 1px solid #E8E6DE; box-shadow: 0 1px 3px rgba(30,37,30,.04); padding: 28px 24px; display: flex; flex-direction: column; gap: 18px; }
  form { display: flex; flex-direction: column; gap: 18px; }
  label { font-size: 14px; font-weight: 600; color: #3C443B; display: block; margin-bottom: 6px; }
  .field { display: flex; flex-direction: column; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  input[type="text"], input[type="tel"], input[type="date"] {
    height: 50px; width: 100%; border-radius: 12px; border: 1px solid #DDDBD2; padding: 0 14px;
    font-size: 15px; font-family: inherit; color: #1E251E; background: #fff;
  }
  input[type="date"] { background: #FBFAF7; }
  .amount-wrap { position: relative; }
  .amount-wrap span { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; color: #7A8177; }
  .amount-wrap input { padding-right: 40px; }
  .link-btn {
    align-self: flex-start; background: none; border: none; padding: 4px 0; margin-top: -8px;
    font-size: 12px; color: #7A8177; text-decoration: underline; cursor: pointer; font-family: inherit;
  }
  .guest-row { display: flex; gap: 8px; }
  .guest-btn { flex: 1; height: 46px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; border: 1px solid #DDDBD2; background: #fff; color: #3C443B; }
  .guest-btn.active { border: 1.5px solid #1F6D57; background: #EAF3EF; color: #1F6D57; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-radius: 12px; background: #F5F4F0; border: 1px solid #E8E6DE; cursor: pointer; }
  .toggle-row.on { background: #EAF3EF; border-color: #1F6D57; }
  .toggle-title { font-size: 15px; font-weight: 600; margin-bottom: 0; }
  .toggle-sub { font-size: 13px; color: #7A8177; margin-top: 2px; }
  .switch { width: 44px; height: 26px; border-radius: 13px; background: #D8D6CD; position: relative; flex-shrink: 0; transition: background .15s; }
  .switch.on { background: #1F6D57; }
  .switch .thumb { width: 20px; height: 20px; border-radius: 50%; background: #fff; position: absolute; top: 3px; left: 3px; transition: left .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch.on .thumb { left: 21px; }
  .summary { margin: 0; font-size: 13px; color: #7A8177; }
  .warning { margin: 0; font-size: 13px; color: #C0392B; font-weight: 700; }
  #canvas {
    width: 100%; height: auto; display: block; border: 1px solid #E8E6DE; border-radius: 16px;
    background: #fff;
  }
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }
  .btn { flex: 1; height: 52px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; font-family: inherit; border: none; }
  .btn-primary { background: #1F6D57; color: #fff; }
  .btn-primary:hover { background: #195C49; }
  .btn-secondary { background: #fff; color: #3C443B; border: 1px solid #D8D6CD; }
  .btn-secondary:hover { background: #F5F4F0; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-secondary:disabled:hover { background: #fff; }
  .btn-primary:disabled:hover { background: #1F6D57; }
  .status-msg { margin: -8px 0 0; font-size: 13px; color: #7A8177; min-height: 1.2em; }
  .account { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-radius: 12px; background: #F5F4F0; margin-top: 6px; }
  .account .num { font-size: 15px; font-weight: 700; }
  .account .name { font-size: 13px; color: #7A8177; margin-top: 2px; }
  .copy-btn { height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid #D8D6CD; background: #fff; color: #3C443B; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .clear-link { background: none; border: none; color: #9A9F92; font-size: 13px; cursor: pointer; text-decoration: underline; font-family: inherit; padding: 4px 2px; }
  .top-actions { display: flex; justify-content: flex-end; margin: -12px 0 14px; }
  .toast { position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%); background: #1E251E; color: #fff; padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: 90vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="inner">
    <div class="eyebrow">원흥LH13단지주거복지지원센터</div>
    <h1>게스트하우스 신청서</h1>

    <div class="tabs">
      <button class="tab active" type="button">타이핑으로 작성</button>
      <a href="draw.html" style="text-decoration:none; flex:1;">
        <button class="tab" type="button" style="width:100%;">손으로 직접 쓰기</button>
      </a>
    </div>

    <div class="top-actions">
      <button type="button" class="clear-link" id="clearSaved">저장정보 초기화</button>
    </div>

    <div class="card">
      <form id="form" autocomplete="on">
        <div class="row2">
          <div class="field">
            <label for="applyDate">신청일</label>
            <input type="text" id="applyDate" inputmode="numeric" placeholder="2026-07-25" maxlength="10" class="date-in">
          </div>
          <div class="field">
            <label for="deposit">은행입금일</label>
            <input type="text" id="deposit" inputmode="numeric" placeholder="2026-07-25" maxlength="10" class="date-in">
          </div>
        </div>

        <div class="field">
          <label for="name">성명</label>
          <input type="text" id="name" placeholder="홍길동" maxlength="20">
        </div>

        <div class="row2">
          <div class="field">
            <label for="unit">동·호수</label>
            <input type="text" id="unit" placeholder="101동 1001호" maxlength="20">
          </div>
          <div class="field">
            <label for="phone">연락처</label>
            <input type="tel" id="phone" placeholder="010-1234-5678" maxlength="20">
          </div>
        </div>

        <div class="row2">
          <div class="field">
            <label for="checkIn">입실일</label>
            <input type="text" id="checkIn" inputmode="numeric" placeholder="2026-07-25" maxlength="10" class="date-in">
          </div>
          <div class="field">
            <label for="checkOut">퇴실일</label>
            <input type="text" id="checkOut" inputmode="numeric" placeholder="2026-07-25" maxlength="10" class="date-in">
          </div>
        </div>

        <div class="field">
          <label>사용인원</label>
          <div class="guest-row" id="guestRow">
            <button type="button" class="guest-btn active" data-n="2">2명</button>
            <button type="button" class="guest-btn" data-n="3">3명</button>
            <button type="button" class="guest-btn" data-n="4">4명</button>
          </div>
          <input type="hidden" id="people" value="2">
        </div>

        <label class="toggle-row" id="holidayRow" for="holiday">
          <input type="checkbox" id="holiday" class="visually-hidden">
          <div>
            <div class="toggle-title">공휴일 요금 적용</div>
            <div class="toggle-sub">전 기간 40,000원</div>
          </div>
          <div class="switch" id="holidaySwitch"><div class="thumb"></div></div>
        </label>

        <div class="field">
          <label for="amount">사용금액</label>
          <div class="amount-wrap">
            <input type="text" id="amount" inputmode="numeric" placeholder="자동 계산">
            <span>원</span>
          </div>
        </div>
        <button type="button" id="resetAmount" class="link-btn" hidden>자동 계산으로 되돌리기</button>

        <p id="summary" class="summary"></p>
        <p id="warning" class="warning" hidden></p>
      </form>

      <canvas id="canvas" width="707" height="1000"></canvas>

      <div class="btn-row">
        <button type="button" id="share" class="btn btn-primary" disabled>이미지 만들어 보내기</button>
        <button type="button" id="download" class="btn btn-secondary" disabled>이미지 저장</button>
      </div>
      <p id="status" class="status-msg"></p>

      <div class="account">
        <div>
          <div class="num">국민 856901-00-129046</div>
          <div class="name">원흥LH13단지주거복지지원센터</div>
        </div>
        <button type="button" class="copy-btn" id="copyAccount">계좌번호 복사</button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { countNights, calcAmount } from './calc.js';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// 707x1000 좌표계. 표 격자선을 픽셀 스캔으로 실측한 각 칸의 중심.
const POS = {
  applyDate: { x: 432, y: 211, maxWidth: 400 },
  name:      { x: 432, y: 241, maxWidth: 400 },
  unit:      { x: 432, y: 270, maxWidth: 400 },
  phone:     { x: 432, y: 300, maxWidth: 400 },
  period:    { x: 301, y: 337, maxWidth: 136 },
  nights:    { x: 560, y: 337, maxWidth: 145 },
  amount:    { x: 301, y: 370, maxWidth: 136 },
  people:    { x: 560, y: 370, maxWidth: 145 },
  deposit:   { x: 301, y: 471, maxWidth: 136 },
};

// 'loading' | 'ready' | 'error'. 이미지가 준비되지 않은 동안은 버튼을 잠그고 캔버스에 아무것도 그리지 않는다.
let imageState = 'loading';

const formImage = new Image();
const imageReady = new Promise((resolve, reject) => {
  formImage.onload = () => { imageState = 'ready'; resolve(); };
  formImage.onerror = () => {
    imageState = 'error';
    reject(new Error('서식 이미지를 불러오지 못했습니다.'));
  };
});
formImage.src = 'form.jpg';

function drawForm(text) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  // 준비 전/실패 시에는 그리지 않고 멈춘다. 이 상태에서 내보내기가 아예 불가능하도록
  // 만드는 것은 syncButtons()의 버튼 잠금이며, 여기서는 오래된 내용만 지운다.
  if (imageState !== 'ready') return;
  try {
    ctx.drawImage(formImage, 0, 0, canvas.width, canvas.height);
  } catch {
    // drawImage가 InvalidStateError를 던지는 경우(이미지가 깨진 상태). render()가 여기서 멈추지 않도록 흡수한다.
    imageState = 'error';
    return;
  }
  ctx.fillStyle = '#000';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  for (const [key, pos] of Object.entries(POS)) {
    const value = text[key];
    if (!value) continue;

    // 칸을 넘치면 들어갈 때까지 폰트를 줄인다.
    let size = 14;
    ctx.font = `${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
    while (ctx.measureText(value).width > pos.maxWidth && size > 8) {
      size -= 1;
      ctx.font = `${size}px "Malgun Gothic", "Apple SD Gothic Neo", sans-serif`;
    }
    ctx.fillText(value, pos.x, pos.y);
  }
}

const $ = (id) => document.getElementById(id);

function readValues() {
  return {
    applyDate: $('applyDate').value,
    name: $('name').value.trim(),
    unit: $('unit').value.trim(),
    phone: $('phone').value.trim(),
    checkIn: $('checkIn').value,
    checkOut: $('checkOut').value,
    people: Number($('people').value),
    holiday: $('holiday').checked,
    amount: Number($('amount').value.replace(/[^0-9]/g, '')),
    amountEntered: /[0-9]/.test($('amount').value),
    deposit: $('deposit').value,
  };
}

// 입실일·퇴실일로 사용기간 문자열을 만든다. 칸이 136px로 좁아 'YYYY-MM-DD ~ YYYY-MM-DD'를
// 그대로 넣으면 폰트가 심하게 줄어든다. 그래서 연도는 앞에 한 번만 쓰고 월·일의 앞자리 0은
// 뗀다. 연도가 바뀌는 경우(예: 12월→1월)에만 뒤쪽 날짜에도 연도를 붙인다.
function shortDate(checkIn, checkOut) {
  if (!checkIn || !checkOut) return '';
  const [y1, m1, d1] = checkIn.split('-').map(Number);
  const [y2, m2, d2] = checkOut.split('-').map(Number);
  const end = y1 === y2 ? `${m2}.${d2}` : `${y2}.${m2}.${d2}`;
  return `${y1}.${m1}.${d1} ~ ${end}`;
}

// 'YYYY-MM-DD' -> 'YYYY.M.D'. 은행입금일 칸(136px)도 사용기간과 같은 이유로 앞자리 0을 뗀다.
function compactDate(s) {
  if (!s) return '';
  const [y, m, d] = s.split('-').map(Number);
  return `${y}.${m}.${d}`;
}

function formatValues(v, nights) {
  return {
    applyDate: v.applyDate ? compactDate(v.applyDate) : '',
    name: v.name,
    unit: v.unit,
    phone: v.phone,
    period: v.checkIn && v.checkOut ? shortDate(v.checkIn, v.checkOut) : '',
    nights: nights ? `${nights}일` : '',
    amount: v.amountEntered ? `${v.amount.toLocaleString('ko-KR')}원` : '',
    people: v.people ? `${v.people}명` : '',
    deposit: v.deposit ? compactDate(v.deposit) : '',
  };
}

// 사용자가 금액을 직접 고쳤는지 추적한다. 고쳤다면 자동 계산으로 덮어쓰지 않는다.
let amountEdited = false;
// 사용자가 금액 칸에 포커스를 두고 있는 동안은 절대 값을 다시 쓰지 않는다(캐럿 점프·자리수 밀림 방지).
let amountFocused = false;
$('amount').addEventListener('input', () => {
  // 숫자를 모두 지워 빈 값으로 돌아가면 자동 계산 모드로 복귀한다.
  // render()는 여기서 부르지 않는다 — #form의 버블링 input 리스너가 한 번만 호출한다.
  amountEdited = /[0-9]/.test($('amount').value);
});
$('amount').addEventListener('focus', () => { amountFocused = true; });
$('amount').addEventListener('blur', () => {
  amountFocused = false;
  render(); // 자리를 떠났고 필드를 비웠다면 즉시 자동 계산으로 복귀시킨다.
});

$('resetAmount').addEventListener('click', () => {
  amountEdited = false;
  render();
});

// 사용인원: 시각은 버튼 3개, 실제 값은 숨김 입력(#people)에 저장한다. readValues()는
// 기존과 동일하게 #people.value만 읽으므로 아래 나머지 로직은 그대로 둔다.
$('guestRow').addEventListener('click', (e) => {
  const btn = e.target.closest('.guest-btn');
  if (!btn) return;
  $('people').value = btn.dataset.n;
  document.querySelectorAll('.guest-btn').forEach((b) => b.classList.toggle('active', b === btn));
  render();
});

// 공휴일: 실제 상태는 체크박스(#holiday)가 그대로 들고 있다. 여기서는 스위치 시각만 맞춘다.
$('holiday').addEventListener('change', () => {
  const on = $('holiday').checked;
  $('holidayRow').classList.toggle('on', on);
  $('holidaySwitch').classList.toggle('on', on);
});

function render() {
  const v = readValues();
  const nights = countNights(v.checkIn, v.checkOut);

  if (!amountEdited && !amountFocused) {
    const auto = calcAmount(v);
    $('amount').value = auto ? auto.toLocaleString('ko-KR') : '';
    v.amount = auto;
    v.amountEntered = auto > 0;
  }
  $('resetAmount').hidden = !amountEdited;

  $('summary').textContent = nights
    ? `${nights}일 ${v.people}명 · ${amountEdited ? '직접 입력' : '자동 계산'} ${v.amount.toLocaleString('ko-KR')}원`
    // 날짜가 둘 다 채워졌는데 0박이면 역전 상태다. 그 안내는 #status가 맡으므로 여기선 비운다.
    : (v.checkIn && v.checkOut ? '' : '입실일과 퇴실일을 선택하세요.');

  const warn = $('warning');
  // 퇴실일<=입실일 상태의 안내는 #status(syncButtons)에서만 표시한다 — 여기서 같은 문장을 또 띄우지 않는다.
  // 버튼은 그와 무관하게 syncButtons()가 계속 잠근다.
  if (v.checkIn && v.checkOut && nights === 0) {
    warn.hidden = true;
  } else if (nights >= 5) {
    warn.textContent = '운영규정상 1세대가 한 달 기준 5박 이상 사용할 수 없습니다.';
    warn.hidden = false;
  } else {
    warn.hidden = true;
  }

  drawForm(formatValues(v, nights));
  syncButtons();
}

const REQUIRED = {
  applyDate: '신청일',
  name: '성명',
  unit: '동·호수',
  phone: '연락처',
  checkIn: '입실일',
  checkOut: '퇴실일',
};

function missingFields(v) {
  return Object.entries(REQUIRED).filter(([k]) => !v[k]).map(([, label]) => label);
}

function toJpegFile() {
  const v = readValues();
  const stamp = v.applyDate.replace(/-/g, ''); // 신청일은 필수값이라 버튼이 활성화된 시점엔 항상 있다.
  return new Promise((resolve, reject) => {
    canvas.toBlob(
      (blob) => {
        if (!blob) return reject(new Error('이미지 생성에 실패했습니다.'));
        resolve(new File([blob], `게스트하우스신청서_${stamp}.jpg`, { type: 'image/jpeg' }));
      },
      'image/jpeg',
      0.92
    );
  });
}

// #status는 "계속 화면에 남아 있어야 하는" 검증/게이팅 안내 전용이다(입력 누락, 날짜 역전,
// 서식 이미지 로딩/실패, 5박 이상 경고 등). syncButtons()에서만 값을 채운다.
function setStatus(msg) { $('status').textContent = msg; }

// 저장했습니다/복사됨/공유 관련 안내처럼 순간적으로 보여주면 되는 메시지는 토스트로 띄운다.
let toastTimer;
function showToast(msg) {
  const toast = $('toast');
  clearTimeout(toastTimer);
  toast.textContent = msg;
  toast.classList.add('show');
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
}

// 필수값이 비거나 숙박일수가 0이거나 서식 이미지가 준비되지 않았으면 버튼을 잠근다.
// render()의 마지막 줄뿐 아니라 이미지 로딩 완료/실패 시에도 별도로 호출된다.
function syncButtons() {
  const v = readValues();
  const missing = missingFields(v);
  const invalidStay = v.checkIn && v.checkOut && countNights(v.checkIn, v.checkOut) === 0;
  const blocked = imageState !== 'ready' || missing.length > 0 || invalidStay;
  $('share').disabled = blocked;
  $('download').disabled = blocked;
  if (imageState === 'error') {
    setStatus('서식 이미지를 불러오지 못했습니다. 새로고침해 주세요.');
  } else if (missing.length > 0) {
    setStatus(`입력이 필요합니다: ${missing.join(', ')}`);
  } else if (invalidStay) {
    setStatus('퇴실일은 입실일보다 뒤여야 합니다.');
  } else if (imageState === 'loading') {
    setStatus('서식 이미지를 불러오는 중입니다...');
  } else {
    setStatus('');
  }
}

$('share').addEventListener('click', async () => {
  try {
    const file = await toJpegFile();
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '게스트하우스 신청서' });
      return;
    }
    showToast('이 브라우저는 공유를 지원하지 않습니다. "이미지 저장"을 눌러 주세요.');
  } catch (err) {
    // 사용자가 공유 시트를 닫은 경우는 오류가 아니다.
    if (err.name === 'AbortError') { return; }
    // iOS 사파리 등에서 사용자 제스처 타이밍 문제로 공유가 실패하는 사례가 흔하다.
    // 영어 브라우저 오류 대신 대안 행동을 안내한다.
    showToast('공유하지 못했습니다. "이미지 저장"을 눌러 저장한 뒤 문자메시지에 직접 첨부해 주세요.');
  }
});

$('download').addEventListener('click', async () => {
  try {
    const file = await toJpegFile();
    const url = URL.createObjectURL(file);
    const a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    a.click();
    // 클릭 직후 바로 해제하면 일부 브라우저(특히 데스크톱 사파리)는 비동기로 다운로드를
    // 시작하다가 이미 해제된 URL을 만나 실패한다. 클릭 처리가 끝난 뒤에 해제한다.
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('저장했습니다.');
  } catch (err) {
    showToast(`이미지를 만들지 못했습니다: ${err.message}`);
  }
});

$('form').addEventListener('input', render);
// select/checkbox의 input 이벤트가 일부 구형 WebKit/WebView에서 누락되는 경우를 대비한 보강.
$('form').addEventListener('change', render);

// 신청일·은행입금일 기본값은 오늘. (sv-SE 로케일은 YYYY-MM-DD 형식을 준다)
const today = new Date().toLocaleDateString('sv-SE');
$('applyDate').value = today;
$('deposit').value = today;

// 연락처를 입력하는 대로 하이픈을 자동으로 넣는다. 숫자만 남긴 뒤 지역/앞자리·중간·끝4자리로 끊는다.
function formatPhone(value) {
  const digits = value.replace(/\D/g, '').slice(0, 11);
  if (digits.length < 4) return digits;
  const a = digits.startsWith('02') ? 2 : 3; // 서울(02)만 지역번호 2자리, 그 외는 3자리
  const rest = digits.slice(a);
  if (rest.length <= 4) return `${digits.slice(0, a)}-${rest}`;
  return `${digits.slice(0, a)}-${rest.slice(0, -4)}-${rest.slice(-4)}`;
}
$('phone').addEventListener('input', (e) => {
  const formatted = formatPhone(e.target.value);
  if (formatted !== e.target.value) e.target.value = formatted;
});

// 날짜는 년-월-일 순서를 기기 설정과 무관하게 고정하기 위해 직접 입력으로 받는다.
// 숫자만 남겨 YYYY-MM-DD 형태로 하이픈을 자동으로 끼운다.
function formatDateInput(value) {
  const d = value.replace(/\D/g, '').slice(0, 8);
  if (d.length <= 4) return d;
  if (d.length <= 6) return `${d.slice(0, 4)}-${d.slice(4)}`;
  return `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6)}`;
}
for (const id of ['applyDate', 'deposit', 'checkIn', 'checkOut']) {
  $(id).addEventListener('input', (e) => {
    const f = formatDateInput(e.target.value);
    if (f !== e.target.value) e.target.value = f;
  });
}

const ACCOUNT_NUMBER = '85690100129046'; // 하이픈 없는 값. 금융앱이 하이픈을 거부하는 경우가 있다.

async function copyText(text, button) {
  const original = button.dataset.label || button.textContent;
  button.dataset.label = original;
  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      // http나 구형 브라우저용 폴백.
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      let ok = false;
      try {
        ta.select();
        ok = document.execCommand('copy');
      } finally {
        ta.remove();
        button.focus();
      }
      if (!ok) throw new Error('execCommand 복사 실패');
    }
    button.textContent = '복사됨';
    showToast('계좌번호가 복사되었습니다.');
  } catch {
    button.textContent = '복사 실패';
  }
  setTimeout(() => { button.textContent = original; }, 1500);
}

$('copyAccount').addEventListener('click', (e) => copyText(ACCOUNT_NUMBER, e.currentTarget));

const STORE_KEY = 'guesthouse-form';
const SAVED_FIELDS = ['name', 'unit', 'phone']; // 매번 같은 값만 저장한다. 날짜·인원·금액은 제외.

function restoreSaved() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    for (const id of SAVED_FIELDS) {
      if (saved[id]) $(id).value = saved[id];
    }
  } catch {
    // 저장값이 깨졌으면 무시하고 빈 폼으로 시작한다.
  }
}

function saveFields() {
  const v = readValues();
  const data = Object.fromEntries(SAVED_FIELDS.map((id) => [id, v[id]]));
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(data));
  } catch {
    // 사파리 프라이빗 모드 등 저장이 막힌 환경. 기능 자체는 계속 동작해야 한다.
  }
}

for (const id of SAVED_FIELDS) {
  $(id).addEventListener('input', saveFields);
}

$('clearSaved').addEventListener('click', () => {
  try {
    localStorage.removeItem(STORE_KEY);
  } catch {
    // 저장이 막힌 환경이면 애초에 지울 것도 없다.
  }
  for (const id of SAVED_FIELDS) $(id).value = '';
  render();
  showToast('저장된 값을 지웠습니다.');
});

restoreSaved();

// 최상위 await를 쓰지 않는다 — Safari 15+/Chrome 89+ 미만에서는 모듈 전체가 파싱 실패해
// 아무 리스너도 붙지 않는 채로 죽어버린다. .then/.catch만으로 같은 순서를 보장한다.
render(); // 이미지가 아직 로딩 중이어도 요약/경고 텍스트와 버튼 잠금 상태를 즉시 반영한다.
imageReady.then(render).catch(() => { syncButtons(); });
</script>
